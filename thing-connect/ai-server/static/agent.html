<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="/v1/ai/config/language.js"></script>
  <meta name="referrer" content="no-referrer">
  <script src="/static/js/mini-program-page.js?v=b30453999596"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-ui-i18n="智能体配置 — 探鸽 · 小钛">智能体配置 — 探鸽 · 小钛</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <style>
    .thin-scroll::-webkit-scrollbar { width: 4px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    .thin-scroll::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .mini-program header > div:first-child > a { display: none; }
    .mini-program #editor-form { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
    html[lang="en"] #voice-lang-filter { flex-wrap: wrap; }
    html[lang="en"] #voice-lang-filter button { white-space: nowrap; }
    .mini-program input, .mini-program textarea, .mini-program select { font-size: 16px; }
  </style>
  <script src="/static/user-shell.js?v=a0238275b6ec"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

<!-- TOPBAR -->
<header class="sticky top-0 z-50 flex items-center justify-between h-[56px] px-4 sm:px-8 bg-white border-b border-gray-200 max-sm:h-[50px] max-sm:px-3.5">
  <div class="flex items-center gap-2 sm:gap-3">
    <a href="/devices" class="flex items-center gap-1 text-sm text-gray-400 hover:text-gray-600 transition-colors max-sm:text-xs">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span class="max-sm:hidden" data-ui-i18n="返回">返回</span>
    </a>
    <span class="w-px h-5 bg-gray-200 max-sm:hidden"></span>
    <div class="flex items-center gap-1.5 sm:gap-2">
      <span class="text-xs text-gray-400" data-ui-i18n="设备">设备</span>
      <span class="font-mono text-xs sm:text-sm font-medium text-gray-900 truncate max-w-[120px] sm:max-w-none" id="header-device-id">—</span>
    </div>
  </div>
  <div class="flex items-center gap-1.5 sm:gap-2" id="header-current-role">
    <span class="w-[6px] h-[6px] sm:w-[7px] sm:h-[7px] rounded-full bg-emerald-500"></span>
    <span class="text-[11px] sm:text-xs text-gray-400 max-sm:hidden" data-ui-i18n="当前角色">当前角色</span>
    <span class="text-xs sm:text-sm font-medium text-emerald-600 truncate max-w-[80px] sm:max-w-none" id="header-role-name" data-ui-i18n="未绑定">未绑定</span>
  </div>
<button type="button" data-language-toggle class="text-xs text-gray-500 px-2 py-1.5 border border-gray-200 rounded-lg shrink-0">English</button></header>

<!-- MAIN -->
<main id="main-layout" class="flex h-[calc(100vh-56px)] max-sm:h-[calc(100vh-50px)] max-sm:flex-col overflow-hidden">

  <!-- LEFT PANEL — Agent List -->
  <aside id="list-panel" class="w-[340px] flex-shrink-0 border-r border-gray-200 bg-white flex flex-col max-sm:w-full max-sm:border-r-0">
    <!-- Search -->
    <div class="px-3 sm:px-4 pt-3 sm:pt-4 pb-2 sm:pb-3">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="搜索智能体…" oninput="filterAgents()"
          class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-9 pr-3 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 focus:bg-white transition-all placeholder:text-gray-400" data-ui-attrs="{&quot;placeholder&quot;:&quot;搜索智能体…&quot;}">
      </div>
    </div>

    <!-- Agent list -->
    <div class="flex-1 overflow-y-auto thin-scroll px-2 sm:px-3 pb-2" id="agent-list">
      <!-- JS populated -->
    </div>

    <!-- New agent button -->
    <div class="px-2 sm:px-3 pb-3 sm:pb-4 pt-2 border-t border-gray-100">
      <button onclick="newAgent()"
        class="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg border border-dashed border-emerald-300 text-sm text-emerald-600 hover:bg-emerald-50 hover:border-emerald-400 transition-all">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span data-ui-i18n="新建智能体">新建智能体</span>
      </button>
    </div>
  </aside>

  <!-- RIGHT PANEL — Editor -->
  <section id="editor-panel" class="flex-1 overflow-y-auto thin-scroll max-sm:hidden">

    <!-- Mobile back button -->
    <div class="hidden max-sm:flex items-center gap-1.5 px-3.5 py-2.5 border-b border-gray-100 bg-white sticky top-0 z-10" id="mobile-back">
      <button onclick="showList()" class="flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span data-ui-i18n="返回列表">返回列表</span>
      </button>
    </div>

    <!-- Empty state -->
    <div id="editor-empty" class="flex flex-col items-center justify-center h-full text-center px-8">
      <div class="w-16 sm:w-20 h-16 sm:h-20 mb-4 sm:mb-5 rounded-2xl bg-emerald-50 border border-dashed border-emerald-200 flex items-center justify-center">
        <svg class="w-7 sm:w-9 h-7 sm:h-9 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <p class="text-base font-semibold text-gray-800 mb-1.5" data-ui-i18n="选择或新建智能体">选择或新建智能体</p>
      <p class="text-sm text-gray-400 max-w-[280px] leading-relaxed" data-ui-i18n="从左侧列表选择一个智能体进行编辑，或点击&quot;新建智能体&quot;创建角色">从左侧列表选择一个智能体进行编辑，或点击"新建智能体"创建角色</p>
    </div>

    <!-- Editor form -->
    <div id="editor-form" class="hidden max-w-[640px] mx-auto px-3 sm:px-8 py-4 sm:py-8">
      <!-- Default role banner -->
      <div id="default-banner" class="hidden mb-4 px-4 py-2.5 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-700" data-ui-i18n="⚠️ 这是系统默认角色，不可编辑。如需自定义，请新建角色后绑定到设备。">⚠️ 这是系统默认角色，不可编辑。如需自定义，请新建角色后绑定到设备。</div>
      <div class="bg-white border border-gray-200 rounded-xl sm:rounded-2xl p-4 sm:p-6 shadow-sm">
        <!-- Avatar -->
        <div class="mb-5 sm:mb-6">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1.5 sm:mb-2 tracking-wide" data-ui-i18n="头像">头像</label>
          <div class="flex items-center gap-3 sm:gap-4">
            <div id="avatar-preview" class="w-14 h-14 sm:w-[72px] sm:h-[72px] rounded-xl sm:rounded-2xl bg-gradient-to-br from-emerald-100 to-emerald-200 border border-emerald-300 flex items-center justify-center text-2xl sm:text-3xl overflow-hidden flex-shrink-0">
              🤖
            </div>
            <div class="flex flex-col gap-1.5">
              <span class="text-sm text-gray-500" data-ui-i18n="角色头像">角色头像</span>
            </div>
          </div>
        </div>

        <!-- Name -->
        <div class="mb-4 sm:mb-5">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1 sm:mb-1.5 tracking-wide"><span data-ui-i18n="智能体名称">智能体名称</span> <span class="text-red-400">*</span></label>
          <input type="text" id="field-name" placeholder="给智能体起个名字"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 sm:px-3.5 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 focus:bg-white transition-all placeholder:text-gray-400" data-ui-attrs="{&quot;placeholder&quot;:&quot;给智能体起个名字&quot;}">
        </div>

        <!-- Description -->
        <div class="mb-4 sm:mb-5">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1 sm:mb-1.5 tracking-wide" data-ui-i18n="智能体描述">智能体描述</label>
          <input type="text" id="field-desc" placeholder="一句话描述智能体的特点和用途"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 sm:px-3.5 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 focus:bg-white transition-all placeholder:text-gray-400" data-ui-attrs="{&quot;placeholder&quot;:&quot;一句话描述智能体的特点和用途&quot;}">
        </div>

        <!-- System Prompt -->
        <div class="mb-4 sm:mb-5">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1 sm:mb-1.5 tracking-wide" data-ui-i18n="角色设定">角色设定</label>
          <textarea id="field-prompt" rows="3" sm:rows="4" placeholder="设定智能体的人设、语气、知识范围和行为规则…"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 sm:px-3.5 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 focus:bg-white transition-all placeholder:text-gray-400 resize-none" data-ui-attrs="{&quot;placeholder&quot;:&quot;设定智能体的人设、语气、知识范围和行为规则…&quot;}"></textarea>
        </div>

        <!-- Welcome Text -->
        <div class="mb-4 sm:mb-5">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1 sm:mb-1.5 tracking-wide" data-ui-i18n="开场白">开场白</label>
          <input type="text" id="field-welcome" placeholder="用户连接时智能体说的第一句话"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 sm:px-3.5 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 focus:bg-white transition-all placeholder:text-gray-400" data-ui-attrs="{&quot;placeholder&quot;:&quot;用户连接时智能体说的第一句话&quot;}">
        </div>

        <!-- Voice Selector -->
        <div class="mb-4 sm:mb-5">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1 sm:mb-1.5 tracking-wide" data-ui-i18n="语音">语音</label>
          <!-- Language filter -->
          <div class="flex gap-1.5 mb-2" id="voice-lang-filter">
            <button onclick="filterVoiceLang('')" data-lang="" class="px-2.5 py-1 text-[11px] rounded-full border bg-emerald-50 border-emerald-300 text-emerald-700 font-medium transition-colors" data-ui-i18n="全部">全部</button>
            <button onclick="filterVoiceLang('zh')" data-lang="zh" class="px-2.5 py-1 text-[11px] rounded-full border bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors" data-ui-i18n="中文">中文</button>
            <button onclick="filterVoiceLang('en')" data-lang="en" title="英文试听使用中文示例" data-ui-attrs="{&quot;title&quot;:&quot;英文试听使用中文示例&quot;}" class="px-2.5 py-1 text-[11px] rounded-full border bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors" data-ui-i18n="英文（试听同中文）">英文（试听同中文）</button>
            <button onclick="filterVoiceLang('ja')" data-lang="ja" class="px-2.5 py-1 text-[11px] rounded-full border bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors" data-ui-i18n="日文">日文</button>
            <button onclick="filterVoiceLang('ko')" data-lang="ko" class="px-2.5 py-1 text-[11px] rounded-full border bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors" data-ui-i18n="韩文">韩文</button>
          </div>
          <div class="flex gap-2">
            <select id="field-voice" onchange="onVoiceChange()"
              class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 sm:px-3.5 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 cursor-pointer transition-all appearance-none"
              style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%239CA3AF%27 stroke-width=%272%27%3E%3Cpath d=%27M6 9l6 6 6-6%27/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
              <option value="" data-ui-i18n="-请选择-">-请选择-</option>
            </select>
            <button id="btn-voice-play" onclick="toggleVoicePreview()"
              class="flex-shrink-0 w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-400 bg-gray-50 hover:bg-emerald-50 hover:border-emerald-300 hover:text-emerald-500 transition-all hidden"
              title="试听" data-ui-attrs="{&quot;title&quot;:&quot;试听&quot;}">
              <svg id="icon-voice-play" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="icon-voice-pause" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
          </div>
          <audio id="voice-audio" class="hidden" onended="onVoicePreviewEnded()" onerror="onVoicePreviewEnded()"></audio>
          <!-- Rate & Pitch -->
          <div class="grid grid-cols-2 gap-x-4 sm:gap-x-6 gap-y-2 mt-3">
            <div>
              <div class="flex items-center justify-between mb-0.5">
                <label class="text-[11px] font-medium text-gray-500" data-ui-i18n="语速">语速</label>
                <span class="text-[11px] text-gray-400 tabular-nums" id="label-rate">1.0</span>
              </div>
              <input type="range" id="field-rate" min="0.5" max="2.0" step="0.1" value="1.0"
                oninput="$('label-rate').textContent = this.value"
                class="w-full h-1.5 rounded-full appearance-none bg-gray-200 cursor-pointer accent-emerald-500">
            </div>
            <div>
              <div class="flex items-center justify-between mb-0.5">
                <label class="text-[11px] font-medium text-gray-500" data-ui-i18n="音调">音调</label>
                <span class="text-[11px] text-gray-400 tabular-nums" id="label-pitch">1.0</span>
              </div>
              <input type="range" id="field-pitch" min="0.5" max="2.0" step="0.1" value="1.0"
                oninput="$('label-pitch').textContent = this.value"
                class="w-full h-1.5 rounded-full appearance-none bg-gray-200 cursor-pointer accent-emerald-500">
            </div>
          </div>
        </div>

        <!-- Service Config -->
        <div class="mb-4 sm:mb-5">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1 sm:mb-1.5 tracking-wide" data-ui-i18n="模型">模型</label>
          <select id="field-model"
            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 sm:px-3.5 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 cursor-pointer transition-all appearance-none"
            style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%239CA3AF%27 stroke-width=%272%27%3E%3Cpath d=%27M6 9l6 6 6-6%27/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
            <option value="" data-ui-i18n="沿用基础配置">沿用基础配置</option>
            <option value="qwen3.5-flash">qwen3.5-flash</option>
            <option value="qwen3.7-plus">qwen3.7-plus</option>
          </select>
        </div>

        <!-- Knowledge Base -->
        <div class="mb-4 sm:mb-5">
          <label class="block text-[11px] sm:text-xs font-medium text-gray-500 mb-1 sm:mb-1.5 tracking-wide" data-ui-i18n="知识库">知识库</label>
          <div class="flex gap-2 mb-2">
            <select id="field-knowledge-index" onchange="onKnowledgeIndexChange()"
              class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 sm:py-2.5 text-sm text-gray-900 outline-none focus:border-emerald-400 cursor-pointer transition-all appearance-none"
              style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%239CA3AF%27 stroke-width=%272%27%3E%3Cpath d=%27M6 9l6 6 6-6%27/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
              <option value="" data-ui-i18n="无">无</option>
            </select>
            <button onclick="editKnowledgeIndex()" id="btn-knowledge-edit" disabled title="编辑知识库"
              class="flex-shrink-0 w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-400 bg-gray-50 hover:bg-emerald-50 hover:border-emerald-300 hover:text-emerald-500 transition-all opacity-40 cursor-not-allowed" data-ui-attrs="{&quot;title&quot;:&quot;编辑知识库&quot;}">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button onclick="deleteKnowledgeIndexBtn()" id="btn-knowledge-delete" disabled title="删除知识库"
              class="flex-shrink-0 w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-400 bg-gray-50 hover:bg-red-50 hover:border-red-300 hover:text-red-500 transition-all opacity-40 cursor-not-allowed" data-ui-attrs="{&quot;title&quot;:&quot;删除知识库&quot;}">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
            <button onclick="openKnowledgeModalForCreate()" id="btn-knowledge-new"
              class="flex-shrink-0 px-3 py-2 text-[11px] font-medium rounded-lg border border-dashed border-gray-300 text-gray-500 hover:border-emerald-300 hover:text-emerald-600 transition-colors" data-ui-i18n="+ 新建">+ 新建</button>
          </div>
          <!-- File upload area (shown when index selected) -->
          <div id="knowledge-files-area" class="hidden">
            <div class="flex gap-2 mb-2">
              <input type="file" id="knowledge-file-input" accept=".txt,.pdf,.doc,.docx,.md,.json"
                class="flex-1 text-[11px] text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-[11px] file:font-medium file:bg-emerald-50 file:text-emerald-600 hover:file:bg-emerald-100">
              <button onclick="uploadKnowledgeFile()"
                class="flex-shrink-0 px-3 py-1.5 text-[11px] font-medium rounded-lg bg-emerald-500 text-white hover:bg-emerald-600 transition-colors" data-ui-i18n="上传">上传</button>
            </div>
            <div id="knowledge-files-list" class="max-h-[120px] overflow-y-auto thin-scroll space-y-1">
              <!-- JS populated -->
            </div>
          </div>
        </div>

        <!-- Divider -->
        <div class="border-t border-gray-100 my-4 sm:my-6"></div>

        <!-- 长期记忆 -->
        <div class="flex items-center gap-2 mb-4 sm:mb-5">
          <span class="text-[11px] sm:text-xs font-medium text-gray-500" data-ui-i18n="长期记忆">长期记忆</span>
          <label class="relative w-9 h-5 rounded-full bg-gray-200 transition-colors has-[:checked]:bg-emerald-500 cursor-pointer">
            <input type="checkbox" id="field-memory" class="sr-only peer">
            <div class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow-sm transition-transform peer-checked:translate-x-4"></div>
          </label>
        </div>

        <!-- MCP 工具 & 设备插件 -->
        <div class="grid grid-cols-2 gap-x-6 sm:gap-x-8 gap-y-4 sm:gap-y-5">
          <div class="flex flex-col gap-1.5">
            <span class="text-[11px] sm:text-xs font-medium text-gray-500" data-ui-i18n="MCP 工具">MCP 工具</span>
            <div id="mcp-tools-list" class="flex flex-col gap-1.5">
              <!-- JS populated -->
            </div>
          </div>
          <div class="flex flex-col gap-1.5">
            <span class="text-[11px] sm:text-xs font-medium text-gray-500" data-ui-i18n="设备插件">设备插件</span>
            <div id="plugin-tools-list" class="flex flex-col gap-1.5">
              <!-- JS populated -->
            </div>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="flex gap-3 mt-6 sm:mt-8 pt-4 sm:pt-6 border-t border-gray-100">
          <button onclick="saveAgent()" id="btn-save"
            class="flex-1 py-2.5 rounded-lg bg-emerald-500 text-white text-sm font-bold hover:bg-emerald-600 active:scale-[0.99] transition-all tracking-wide" data-ui-i18n="保存">保存</button>
          <button onclick="deleteAgent()" id="btn-delete"
            class="px-4 sm:px-5 py-2.5 rounded-lg border border-red-200 text-red-500 text-sm font-medium hover:bg-red-50 hover:border-red-300 active:scale-[0.99] transition-all" data-ui-i18n="删除">删除</button>
        </div>

        <!-- Bind to device -->

<!-- TOAST -->
<div id="toast" class="fixed bottom-6 sm:bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs sm:text-sm px-4 sm:px-5 py-2.5 rounded-full pointer-events-none whitespace-nowrap z-[300] opacity-0 transition-opacity duration-200 border border-transparent"></div>

<script>
const $ = id => document.getElementById(id);
const token = window.MiniProgramPage.token;
if (!token) window.MiniProgramPage.requireLogin();

// ── State ──
let agents = [];
let currentAgentId = null;
let boundRoleId = null;
let deviceId = '';
let defaultRoleId = '';
let defaultRole = null;
let isEditingDefault = false;
let selectingRole = 0;
let savingRole = false;
let bindingRole = false;
let editorDirty = false;
let voices = [];
let voiceLang = '';
let knowledgeIndexes = [];
let knowledgeFiles = [];
let mcpTools = [];
let mcpLoadError = false;
let selectedMcpTools = [];
let roleMcpCandidates = [];
let pluginTools = [];
let pluginLoadError = false;
let selectedPlugins = [];
let rolePluginCandidates = [];

// ── Modal editing state ──
let editingMcpToolId = null;
let editingMcpConfig = null;
let editingPluginId = null;
let pluginModalRequest = 0;
let pluginModalInputParams = [];
let pluginModalReturnParams = [];
let editingKnowledgeIndexId = null;

// ── Mobile detection ──
function isMobile() { return window.innerWidth < 640; }

// ── API ──
async function api(path, opts = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(path, {
      ...opts,
      signal: controller.signal,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });
    let result;
    try {
      result = await res.json();
    } catch {
      return { code: res.status >= 400 ? res.status : 50000, get msg() { return WebI18n.t("服务暂时不可用，请稍后重试"); } };
    }
    if (result.code === 401) window.MiniProgramPage.requireLogin();
    return result;
  } finally {
    clearTimeout(timeout);
  }
}

// ── Toast ──
function toast(msg, error = false) {
  const el = $('toast');
  WebI18n.bindText(el, () => (WebI18n.t(msg)), "textContent");
  el.style.borderColor = error ? 'rgba(239,68,68,0.4)' : 'rgba(16,185,129,0.4)';
  el.classList.add('!opacity-100');
  setTimeout(() => el.classList.remove('!opacity-100'), 2400);
}

// ── Init ──
async function init() {
  if (!token) return;
  const params = new URLSearchParams(location.search);
  deviceId = params.get('device_id') || '';
  if (!deviceId) {
    WebI18n.bindText($('header-device-id'), () => (WebI18n.t("未指定设备")), "textContent");
    return;
  }
  WebI18n.bindText($('header-device-id'), () => (deviceId), "textContent");

  // Load bound role (also reveals default_role_id)
  const bindData = await api('/v1/ai/device/' + encodeURIComponent(deviceId) + '/role');
  if (bindData.code !== 200) throw new Error(WebI18n.t("无法读取设备角色"));
  if (bindData.code === 200) {
    if (bindData.data?.role_id) boundRoleId = bindData.data.role_id;
    defaultRoleId = bindData.data?.default_role_id || '';
  }

  // Fetch default role (with fallback if cloud API is unreachable)
  if (defaultRoleId) {
    const defData = await api('/v1/ai/roles/default');
    if (defData.code === 200 && defData.data) {
      defaultRole = defData.data;
    } else {
      // API unreachable — show placeholder until cloud API is available
      defaultRole = { id: defaultRoleId, get name() { return WebI18n.t("默认智能体"); }, agent_config: { get prompt() { return WebI18n.t("系统预置的默认 AI 角色"); } }, user_params: { get description() { return WebI18n.t("系统默认"); }, interrupt_mode: 'auto' } };
    }
  }

  // Load agent list, voices, knowledge indexes, and MCP tools in parallel
  await Promise.all([loadAgents(), loadVoices(), loadKnowledgeIndexes(), loadMcpTools(), loadPlugins()]);

  // Auto-select bound role or default role on page load
  const targetId = boundRoleId || defaultRoleId;
  if (targetId && agents.find(a => a.id === targetId)) {
    await selectAgent(targetId);
  }
}

function isDefaultRole(id) { return defaultRole && id === defaultRole.id; }
function effectiveRoleId() { return boundRoleId || defaultRoleId; }

async function loadAgents() {
  const data = await api('/v1/ai/roles');
  if (data.code === 200 && data.data?.items) {
    agents = data.data.items;
  } else {
    throw new Error(WebI18n.t("无法加载角色列表"));
  }
  // Always prepend default role if it exists
  if (defaultRole) {
    agents = agents.filter(a => a.id !== defaultRole.id);
    agents.unshift(defaultRole);
  }
  renderAgentList();
  updateHeaderBinding();
}

// ── Mobile: show editor panel ──
function showEditor() {
  $('list-panel').classList.add('max-sm:hidden');
  $('editor-panel').classList.remove('max-sm:hidden');
  $('mobile-back').classList.add('max-sm:flex');
  $('mobile-back').classList.remove('hidden');
}

function showList() {
  $('editor-panel').classList.add('max-sm:hidden');
  $('list-panel').classList.remove('max-sm:hidden');
  $('mobile-back').classList.remove('max-sm:flex');
  $('mobile-back').classList.add('hidden');
}

// ── Render ──
function escapeText(value) {
  return String(value || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

function renderAgentList() {
  const query = ($('search-input').value || '').toLowerCase();
  const filtered = agents.filter(a =>
    !query || a.name.toLowerCase().includes(query) || (a.user_params?.description || '').toLowerCase().includes(query)
  );

  const container = $('agent-list');
  if (!filtered.length) {
    container.innerHTML = "<p class=\"text-center text-xs text-gray-400 py-12\"><span data-ui-i18n=\"没有匹配的智能体\">没有匹配的智能体</span></p>";
    return;
  }

  container.innerHTML = filtered.map(a => `
    <div class="group flex items-start gap-2.5 sm:gap-3 px-2.5 sm:px-3 py-2.5 sm:py-3 rounded-lg cursor-pointer mb-1 transition-all
      ${currentAgentId === a.id ? 'bg-emerald-50 border border-emerald-200' : 'border border-transparent hover:bg-gray-50 hover:border-gray-200'}"
      data-role-id="${escapeText(a.id)}">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-emerald-100 to-emerald-200 border border-emerald-300 flex items-center justify-center text-lg sm:text-xl flex-shrink-0">
        AI
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 sm:gap-2">
          <span class="text-[13px] sm:text-sm font-medium text-gray-800 truncate">${escapeText(a.name)}</span>
          ${isDefaultRole(a.id) ? "<span class=\"flex-shrink-0 text-[10px] px-1.5 py-0.5 rounded-full bg-amber-50 text-amber-600 border border-amber-200\"><span data-ui-i18n=\"默认\">默认</span></span>" : ''}
          ${a.id === effectiveRoleId() ? "<span class=\"flex-shrink-0 text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200\"><span data-ui-i18n=\"使用中\">使用中</span></span>" : ''}
        </div>
        <p class="text-[11px] sm:text-xs text-gray-400 mt-0.5 truncate">${a.user_params?.description || a.agent_config?.prompt?.slice(0, 40) ? escapeText(a.user_params?.description || a.agent_config?.prompt?.slice(0, 40)) : WebI18n.mark("暂无描述")}</p>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('[data-role-id]').forEach(row => {
    row.onclick = () => selectAgent(row.dataset.roleId);
  });
}

function setFieldsReadonly(readonly) {
  ['field-name','field-desc','field-prompt','field-welcome','field-voice','field-model','field-rate','field-pitch','field-knowledge-index','field-memory'].forEach(id => {
    const el = $(id);
    if (!el) return;
    if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'range') {
      if (readonly) el.setAttribute('disabled', '');
      else el.removeAttribute('disabled');
    } else {
      el.readOnly = readonly;
      if (readonly) el.classList.add('opacity-60', 'cursor-not-allowed');
      else el.classList.remove('opacity-60', 'cursor-not-allowed');
    }
  });
  // Voice lang filter and play button
  $('voice-lang-filter').querySelectorAll('button').forEach(b => {
    if (readonly) { b.setAttribute('disabled', ''); b.classList.add('opacity-60'); }
    else { b.removeAttribute('disabled'); b.classList.remove('opacity-60'); }
  });
  $('btn-voice-play').classList.toggle('hidden', readonly);
  // Knowledge base upload area — hide when readonly
  if (readonly) $('knowledge-files-area').classList.add('hidden');
  $('btn-knowledge-new').classList.toggle('hidden', readonly);
  onKnowledgeIndexChange();
}

async function selectAgent(id) {
  if (savingRole || bindingRole) return;
  if (editorDirty && !confirm(WebI18n.t("当前修改尚未保存，确定切换角色吗？"))) return;
  const request = ++selectingRole;
  let a = agents.find(x => x.id === id);
  if (!a) return;
  if (!isDefaultRole(id)) {
    try {
      const detail = await api('/v1/ai/roles/' + encodeURIComponent(id));
      if (request !== selectingRole) return;
      if (detail.code !== 200 || !detail.data) {
        toast(WebI18n.errorMessage(detail, WebI18n.t("角色详情加载失败，请重试")), true);
        return;
      }
      a = { ...a, ...detail.data };
      agents = agents.map(item => item.id === id ? a : item);
    } catch {
      if (request === selectingRole) toast("角色详情加载失败，请检查网络后重试", true);
      return;
    }
  }
  currentAgentId = id;
  editorDirty = false;
  isEditingDefault = isDefaultRole(id);

  // Reset language filter so the agent's voice is always visible
  if (voiceLang) filterVoiceLang('');

  $('editor-empty').classList.add('hidden');
  $('editor-form').classList.remove('hidden');
  if (isEditingDefault) {
    $('default-banner').classList.remove('hidden');
    $('btn-delete').classList.add('hidden');
  } else {
    $('default-banner').classList.add('hidden');
    $('btn-delete').classList.remove('hidden');
  }
  updateBindButton();
  if (isMobile()) showEditor();

  $('field-name').value = a.name || '';
  $('field-desc').value = a.user_params?.description || '';
  $('field-prompt').value = a.agent_config?.prompt || '';
  $('field-welcome').value = a.agent_config?.welcome_text || '';
  setSelectValue('field-voice', a.service_config?.config?.tts?.provider_params?.voice || a.user_params?.voice || '');
  const modelName = a.service_config?.config?.llm?.provider_params?.model || '';
  setSelectValue('field-model', modelName);
  // TTS params
  const tts = a.service_config?.config?.tts?.provider_params;
  $('field-rate').value = tts?.rate ?? 1.0;
  WebI18n.bindText($('label-rate'), () => ($('field-rate').value), "textContent");
  $('field-pitch').value = tts?.pitch ?? 1.0;
  WebI18n.bindText($('label-pitch'), () => ($('field-pitch').value), "textContent");
  // Knowledge base
  const ragIdxId = a.agent_config?.ali_rag?.index_id || '';
  setSelectValue('field-knowledge-index', ragIdxId);
  onKnowledgeIndexChange();
  // MCP tools & device plugins
  setRoleResourceSelections(a.agent_config);
  $('field-memory').checked = a.agent_config?.ali_memory?.enable === true;

  if (a.avatar && a.avatar.startsWith('http')) {
    const image = document.createElement('img');
    image.src = a.avatar;
    WebI18n.bindText(image, () => (WebI18n.t("角色头像")), "alt");
    image.className = 'w-full h-full object-cover rounded-xl sm:rounded-2xl';
    $('avatar-preview').replaceChildren(image);
  } else {
    WebI18n.bindText($('avatar-preview'), () => (a.avatar || '🤖'), "textContent");
  }

  setFieldsReadonly(isEditingDefault);
  if (a.service_config?.type && a.service_config.type !== 'custom-compose') {
    ['field-model', 'field-voice', 'field-rate', 'field-pitch'].forEach(id => { $(id).disabled = true; });
  }
  renderAgentList();
}

// Keep saved values visible even when a resource list is filtered or unavailable.
function setSelectValue(id, value) {
  const select = $(id);
  if (value && ![...select.options].some(option => option.value === value)) {
    select.add(new Option(value, value));
  }
  select.value = value;
}

function newAgent() {
  if (savingRole || bindingRole) return;
  if (editorDirty && !confirm(WebI18n.t("当前修改尚未保存，确定新建角色吗？"))) return;
  selectingRole += 1;
  editorDirty = false;
  currentAgentId = null;
  isEditingDefault = false;
  $('editor-empty').classList.add('hidden');
  $('editor-form').classList.remove('hidden');
  $('default-banner').classList.add('hidden');
  $('btn-delete').classList.add('hidden');
  updateBindButton();
  if (isMobile()) showEditor();

  $('field-name').value = '';
  $('field-desc').value = '';
  $('field-prompt').value = '';
  $('field-welcome').value = '';
  $('field-voice').value = '';
  filterVoiceLang(''); // reset language filter
  $('field-model').value = 'qwen3.5-flash';
  $('field-rate').value = 1.0; WebI18n.bindText($('label-rate'), () => ('1.0'), "textContent");

async function loadVoices() {
  const data = await api('/v1/ai/voices');
  if (data.code === 200 && data.data?.items?.length) {
    voices = data.data.items;
  } else {
    voices = [];
    if (data.code !== 200) toast("音色列表暂不可用，请稍后重试", true);
  }
  renderVoiceOptions();
}

function renderVoiceOptions() {
  const sel = $('field-voice');
  const currentVal = sel.value;
  // Keep the first "未选择" option, clear the rest
  while (sel.options.length > 1) sel.remove(1);
  // This editor configures ali-tts. The system catalog also contains voices
  // for other providers, which must not be offered as ali-tts choices.
  const filtered = voices.filter(v => v.model === 'cosyvoice-v3-flash' &&
    (!voiceLang || v.languages?.includes(voiceLang)));
  filtered.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    WebI18n.bindText(opt, () => (v.name), "textContent");
    sel.appendChild(opt);
  });
  setSelectValue('field-voice', currentVal);
  updateVoicePlayButton();
}

function filterVoiceLang(lang) {
  voiceLang = lang;
  // Update button styles
  document.querySelectorAll('#voice-lang-filter button').forEach(btn => {
    const isActive = btn.dataset.lang === lang;
    btn.className = isActive
      ? 'px-2.5 py-1 text-[11px] rounded-full border bg-emerald-50 border-emerald-300 text-emerald-700 font-medium transition-colors'
      : 'px-2.5 py-1 text-[11px] rounded-full border bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors';
  });
  renderVoiceOptions();
}

function onVoiceChange() {
  stopVoicePreview();
  updateVoicePlayButton();
}

function updateVoicePlayButton() {
  const btn = $('btn-voice-play');
  const sel = $('field-voice');
  const voice = voices.find(v => v.id === sel.value);
  if (voice && voice.sample_url) {
    btn.classList.remove('hidden');
  } else {
    btn.classList.add('hidden');
    stopVoicePreview();
  }
}

function toggleVoicePreview() {
  const sel = $('field-voice');
  const voice = voices.find(v => v.id === sel.value);
  if (!voice || !voice.sample_url) return;
  const audio = $('voice-audio');
  const playIcon = $('icon-voice-play');
  const pauseIcon = $('icon-voice-pause');
  if (!audio.paused) {
    stopVoicePreview();
  } else {
    audio.src = voice.sample_url;
    audio.play().catch(() => {});
    playIcon.classList.add('hidden');
    pauseIcon.classList.remove('hidden');
  }
}

function stopVoicePreview() {
  const audio = $('voice-audio');
  audio.pause();
  audio.currentTime = 0;
  $('icon-voice-play').classList.remove('hidden');
  $('icon-voice-pause').classList.add('hidden');
}

function onVoicePreviewEnded() {
  stopVoicePreview();
}

    knowledgeIndexes = data.data.items;

// ── Knowledge Index Modal ──

function openKnowledgeModalForCreate() {
  editingKnowledgeIndexId = null;
  WebI18n.bindText($('knowledge-modal-title'), () => (WebI18n.t("创建知识库")), "textContent");
  WebI18n.bindText($('knowledge-modal-submit-btn'), () => (WebI18n.t("确认创建")), "textContent");
  $('knowledge-modal-name').value = '';
  $('knowledge-modal-desc').value = '';
  $('knowledge-modal-files-section').classList.add('hidden');
  $('knowledge-modal').classList.remove('hidden');
  $('knowledge-modal').classList.add('flex');
}

async function editKnowledgeIndex() {
  const idxId = $('field-knowledge-index').value;
  if (!idxId) return;
  // List only carries {id,name}; fetch full detail (description, etc.) on demand.
  const res = await api('/v1/ai/knowledge/indexes/' + idxId);
  const idx = (res.code === 200 && res.data) ? res.data : null;
  if (!idx) { toast(WebI18n.errorMessage(res, WebI18n.t("加载失败")), true); return; }
  editingKnowledgeIndexId = idxId;
  WebI18n.bindText($('knowledge-modal-title'), () => (WebI18n.t("编辑知识库")), "textContent");
  WebI18n.bindText($('knowledge-modal-submit-btn'), () => (WebI18n.t("确认修改")), "textContent");
  $('knowledge-modal-name').value = idx.name || '';
  $('knowledge-modal-desc').value = idx.description || '';
  $('knowledge-modal-files-section').classList.remove('hidden');
  $('knowledge-modal').classList.remove('hidden');
  $('knowledge-modal').classList.add('flex');
  loadKnowledgeModalFiles();
}

function closeKnowledgeModal() {
  $('knowledge-modal').classList.add('hidden');
  $('knowledge-modal').classList.remove('flex');
  editingKnowledgeIndexId = null;
}

async function saveKnowledgeModal() {
  const name = $('knowledge-modal-name').value.trim();
  const description = $('knowledge-modal-desc').value.trim();
  if (!name) { toast("请输入知识库名称", true); return; }
  if (!description) { toast("请输入知识库描述", true); return; }

  if (editingKnowledgeIndexId) {
    const res = await api('/v1/ai/knowledge/indexes/' + editingKnowledgeIndexId, {
      method: 'PUT',
      body: JSON.stringify({ name, description }),
    });
    if (res.code === 200) {
      await loadKnowledgeIndexes();
      $('field-knowledge-index').value = editingKnowledgeIndexId;
      closeKnowledgeModal();
      toast("知识库已更新");
    } else {
      toast(WebI18n.errorMessage(res, WebI18n.t("更新失败")), true);
    }
  } else {
    const res = await api('/v1/ai/knowledge/indexes', {
      method: 'POST',
      body: JSON.stringify({ name, description }),
    });
    if (res.code === 200 && res.data) {
      await loadKnowledgeIndexes();
      $('field-knowledge-index').value = res.data.index_id;
      onKnowledgeIndexChange();
      closeKnowledgeModal();
      toast("知识库已创建");
    } else {
      toast(WebI18n.errorMessage(res, WebI18n.t("创建失败")), true);
    }
  }
}

async function deleteKnowledgeIndexBtn() {
  const idxId = $('field-knowledge-index').value;
  if (!idxId) return;
  if (!confirm(WebI18n.t("确定删除该知识库？已绑定此知识库的智能体将失去检索能力。"))) return;
  const res = await api('/v1/ai/knowledge/indexes/' + idxId, { method: 'DELETE' });
  if (res.code === 200) {
    await loadKnowledgeIndexes();
    $('field-knowledge-index').value = '';
    onKnowledgeIndexChange();
    toast("已删除");
  } else {
    toast(WebI18n.errorMessage(res, WebI18n.t("删除失败")), true);
  }
}

async function fetchKnowledgeDocuments(indexId) {
  const items = [];
  for (let page = 1; page <= 1000; page++) {
    const result = await api('/v1/ai/knowledge/indexes/' + encodeURIComponent(indexId) + '/documents?page=' + page + '&page_size=100');
    if (result.code !== 200 || !Array.isArray(result.data?.items)) throw new Error(WebI18n.t("读取知识库文档失败"));
    items.push(...result.data.items);
    if (items.length >= result.data.total) return items;
    if (!result.data.items.length) throw new Error(WebI18n.t("知识库文档分页不完整"));
  }
  throw new Error(WebI18n.t("知识库文档过多，请缩小索引范围"));
}

async function loadKnowledgeFiles() {
  const idxId = $('field-knowledge-index').value;
  if (!idxId) return;
  try {
    const files = await fetchKnowledgeDocuments(idxId);
    if ($('field-knowledge-index').value !== idxId) return;
    knowledgeFiles = files;
    renderKnowledgeFiles();
  } catch {
    if ($('field-knowledge-index').value === idxId) toast("读取知识库文档失败，请重试", true);
  }
}

function renderKnowledgeFiles() {
  const container = $('knowledge-files-list');
  if (!knowledgeFiles.length) {
    container.innerHTML = "<p class=\"text-[11px] text-gray-400 py-2\"><span data-ui-i18n=\"暂无文件，上传文件到知识库\">暂无文件，上传文件到知识库</span></p>";
    return;
  }
  container.innerHTML = knowledgeFiles.map(f => `
    <div class="flex items-center justify-between py-1 px-2 rounded bg-gray-50 text-[11px]">
      <span class="text-gray-700 truncate flex-1">${f.name}</span>
      <span class="text-gray-400 mx-2 flex-shrink-0">${formatFileSize(f.size)}</span>
      <button onclick="deleteKnowledgeFile('${f.document_id}')" class="text-red-400 hover:text-red-600 flex-shrink-0" title="删除" data-ui-attrs="{&quot;title&quot;:&quot;删除&quot;}">&times;</button>
    </div>
  `).join('');
}

function formatFileSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
}

async function uploadKnowledgeFile() {
  const input = $('knowledge-file-input');
  const file = input.files[0];
  if (!file) { toast("请选择文件", true); return; }
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch('/v1/ai/knowledge/files', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: formData,
  });
  const data = await res.json();
  if (data.code === 200) {
    toast("上传成功");
    input.value = '';
    loadKnowledgeFiles();
  } else {
    toast(WebI18n.errorMessage(data, WebI18n.t("上传失败")), true);
  }
}

async function deleteKnowledgeFile(docId) {
  if (!confirm(WebI18n.t("确定删除该文件？"))) return;
  const data = await api('/v1/ai/knowledge/files/' + docId, { method: 'DELETE' });
  if (data.code === 200) {
    knowledgeFiles = knowledgeFiles.filter(f => f.document_id !== docId);
    renderKnowledgeFiles();
    toast("已删除");
  } else {
    toast(WebI18n.errorMessage(data, WebI18n.t("删除失败")), true);
  }
}

async function loadKnowledgeModalFiles() {

function renderKnowledgeModalFiles() {
  const container = $('knowledge-modal-files-list');
  if (!knowledgeModalFiles.length) {
    container.innerHTML = "<p class=\"text-[11px] text-gray-400 py-2\"><span data-ui-i18n=\"暂无关联文件\">暂无关联文件</span></p>";
    return;
  }
  container.innerHTML = knowledgeModalFiles.map(f => `

    </div>
  `).join('');

// bindDocumentToIndex adds docId to the editing index's document_ids. The cloud
// upload API does NOT auto-bind a file to an index — you must PUT document_ids.
// (apifox: 上传文件 → file_id → 更新索引关联 document_ids.)
async function bindDocumentToIndex(docId) {
  const idxRes = await api('/v1/ai/knowledge/indexes/' + editingKnowledgeIndexId);
  if (idxRes.code !== 200 || !idxRes.data) {
    toast("关联失败：读取知识库失败", true);
    return false;
  }
  const docIds = idxRes.data.document_ids || [];
  if (docIds.includes(docId)) return true;
  docIds.push(docId);
  const putRes = await api('/v1/ai/knowledge/indexes/' + editingKnowledgeIndexId, {
    method: 'PUT',
    body: JSON.stringify({ document_ids: docIds }),
  });
  if (putRes.code !== 200) {
    toast(WebI18n.errorMessage(putRes, WebI18n.t("关联失败")), true);
    return false;
  }
  return true;
}

async function uploadKnowledgeModalFile() {
  const input = $('knowledge-modal-file-input');
  const file = input.files[0];
  if (!file) { toast("请选择文件", true); return; }
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch('/v1/ai/knowledge/files', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: formData,
  });
  const data = await res.json();
  if (data.code !== 200 || !data.data?.file_id) {
    toast(WebI18n.errorMessage(data, WebI18n.t("上传失败")), true);
    return;
  }
  // file_id IS the document_id (confirmed); upload only pools the file, so bind
  // it to this index next via PUT document_ids.
  if (!await bindDocumentToIndex(data.data.file_id)) return;
  toast("已上传并关联");
  input.value = '';
  loadKnowledgeModalFiles();
}

async function deleteKnowledgeModalFile(docId) {
  if (!confirm(WebI18n.t("确定从该知识库移除该文件？文件本身保留在文件池。"))) return;
  // Unbind = remove from document_ids (PUT full list). The file is not deleted.
  const idxRes = await api('/v1/ai/knowledge/indexes/' + editingKnowledgeIndexId);
  if (idxRes.code !== 200 || !idxRes.data) { toast("读取失败", true); return; }
  const docIds = (idxRes.data.document_ids || []).filter(id => id !== docId);
  const putRes = await api('/v1/ai/knowledge/indexes/' + editingKnowledgeIndexId, {
    method: 'PUT',
    body: JSON.stringify({ document_ids: docIds }),
  });
  if (putRes.code === 200) {
    knowledgeModalFiles = knowledgeModalFiles.filter(f => f.document_id !== docId);
    renderKnowledgeModalFiles();
    toast("已移除");
  } else {
    toast(WebI18n.errorMessage(putRes, WebI18n.t("移除失败")), true);
  }
}

// ── MCP Tools ──

// A role can reference resources absent from the user's catalog. Keep these
// associations visible without treating them as user-managed resources.
function setRoleResourceSelections(config = {}) {
  selectedMcpTools = [...(config?.mcp_tools || [])];
  selectedPlugins = [...(config?.device_plugins || [])];
  roleMcpCandidates = [...selectedMcpTools];
  rolePluginCandidates = [...selectedPlugins];
  renderMcpTools();
  renderPlugins();
}

function roleResourceItems(catalog, selected, readonly, initial = []) {
  const byId = new Map(catalog.map(item => [item.id, item]));
  const ids = readonly ? selected : [...byId.keys(), ...initial, ...selected];
  return [...new Set(ids)].filter(Boolean).map(id => ({
    ...byId.get(id), id, referenceOnly: !byId.has(id),
  }));
}

async function loadMcpTools() {
  const results = await Promise.allSettled([
    api('/v1/ai/mcp/tools'),
    api('/v1/ai/mcp/app-tools'),
  ]);
  mcpLoadError = false;
  results.forEach((result, index) => {
    const source = index === 0 ? 'global' : 'app';
    if (result.status !== 'fulfilled' || result.value.code !== 200 || !Array.isArray(result.value.data?.items)) {
      mcpLoadError = true;
      return;
    }
    mcpTools = mcpTools.filter(t => t.source !== source);
    mcpTools.push(...result.value.data.items.map(t => ({ ...t, source })));
  });
  if (mcpLoadError) toast("MCP 工具列表加载失败，请稍后重试", true);
  renderMcpTools();
}

function renderMcpTools() {
  const container = $('mcp-tools-list');
  const readonly = isEditingDefault;
  const items = roleResourceItems(mcpTools, selectedMcpTools, readonly, roleMcpCandidates);
  if (!items.length) {
    container.innerHTML = '<span class="text-[11px] text-gray-400">' + (mcpLoadError ? WebI18n.mark("MCP 工具列表加载失败，请稍后重试") : readonly ? WebI18n.mark("未关联 MCP 工具") : WebI18n.mark("暂无可用工具")) + '</span>';
  } else {
    container.innerHTML = items.map(t => {
      const checked = selectedMcpTools.includes(t.id);
      const bg = checked ? 'bg-emerald-500' : 'bg-gray-200';
      const dot = checked ? 'translate-x-3.5' : '';
      const canToggle = !readonly;
      const op = canToggle ? 'cursor-pointer' : 'opacity-60 cursor-not-allowed';
      const label = t.name || t.id;
      const editBtns = (!readonly && !t.referenceOnly && t.source === 'app') ? `
        <button onclick="${escapeText('event.stopPropagation(); openMcpToolModal(' + JSON.stringify(t.id) + ')')}" class="text-[10px] text-gray-400 hover:text-emerald-500 flex-shrink-0 ml-1" title="编辑" data-ui-attrs="{&quot;title&quot;:&quot;编辑&quot;}">✎</button>
        <button onclick="${escapeText('event.stopPropagation(); deleteMcpTool(' + JSON.stringify(t.id) + ')')}" class="text-[10px] text-red-400 hover:text-red-600 flex-shrink-0 ml-1" title="删除" data-ui-attrs="{&quot;title&quot;:&quot;删除&quot;}">&times;</button>
      ` : '';
      return `
      <div class="flex items-center min-w-0 ${op}" onclick="${canToggle ? escapeText('toggleMcp(' + JSON.stringify(t.id) + ')') : ''}">
        <span class="text-[11px] text-gray-600 truncate flex-1 mr-2" title="${escapeText(t.name ? label : WebI18n.t("名称暂不可用：") + t.id)}">${escapeText(label)}</span>
        ${readonly ? "<span class=\"text-[10px] text-gray-400 flex-shrink-0\"><span data-ui-i18n=\"已关联\">已关联</span></span>" : `<div class="relative w-8 h-[18px] rounded-full transition-colors flex-shrink-0 ${bg}">
          <div class="absolute top-0.5 left-0.5 w-3.5 h-3.5 rounded-full bg-white shadow-sm transition-transform ${dot}"></div>
        </div>`}
        ${editBtns}
      </div>`;
    }).join('');
    if (mcpLoadError) container.insertAdjacentHTML('beforeend', "<span class=\"text-[11px] text-gray-400\"><span data-ui-i18n=\"MCP 工具列表加载失败，请稍后重试\">MCP 工具列表加载失败，请稍后重试</span></span>");
  }
  if (!readonly) {
    container.insertAdjacentHTML('beforeend', `<button onclick="openMcpToolModal()" class="text-[11px] text-emerald-600 hover:text-emerald-700 text-left mt-1 w-full" data-ui-i18n="+ 新建 MCP 工具">+ 新建 MCP 工具</button>`);
  }
}

function toggleMcp(toolId) {
  if (isEditingDefault) return;
  const tool = mcpTools.find(t => t.id === toolId);
  if (tool && tool.source === 'app' && tool.enabled === false) return;
  const idx = selectedMcpTools.indexOf(toolId);
  if (idx >= 0) selectedMcpTools.splice(idx, 1);
  else selectedMcpTools.push(toolId);
  editorDirty = true;
  renderMcpTools();
}

// ── App MCP Tool Modal ──

function onMcpAuthTypeChange() {
  $('mcp-modal-bearer-field').classList.toggle('hidden', $('mcp-modal-auth-type').value !== 'bearer');
}

async function openMcpToolModal(id) {
  editingMcpToolId = id || null;
  // List only carries {id,name}; fetch full config on demand when editing.
  let tool = null;
  if (id) {
    const res = await api('/v1/ai/mcp/app-tools/' + id);
    if (res.code === 200 && res.data) tool = res.data;
  }
  if (id && !tool) { toast("读取工具配置失败，请重试", true); return; }
  editingMcpConfig = tool?.config || null;
  WebI18n.bindText($('mcp-tool-modal-title'), () => (tool ? WebI18n.t("编辑 MCP 工具") : WebI18n.t("新增 MCP 工具")), "textContent");
  WebI18n.bindText($('mcp-modal-submit-btn'), () => (tool ? WebI18n.t("确认修改") : WebI18n.t("确认创建")), "textContent");
  $('mcp-modal-name').value = tool?.config?.name || '';
  $('mcp-modal-desc').value = tool?.config?.description || '';
  $('mcp-modal-url').value = tool?.config?.url || '';
  $('mcp-modal-auth-type').value = tool?.config?.authentication?.type || '';
  $('mcp-modal-bearer-token').value = tool?.config?.authentication?.bearer_token || '';
  $('mcp-modal-enabled').checked = tool ? !!tool.enabled : true;
  onMcpAuthTypeChange();
  $('mcp-tool-modal').classList.remove('hidden');
  $('mcp-tool-modal').classList.add('flex');
}

function closeMcpToolModal() {
  $('mcp-tool-modal').classList.add('hidden');
  $('mcp-tool-modal').classList.remove('flex');
  editingMcpToolId = null;
  editingMcpConfig = null;
}

async function saveMcpToolModal() {
  const name = $('mcp-modal-name').value.trim();
  const url = $('mcp-modal-url').value.trim();
  if (!name) { toast("请输入工具名称", true); return; }
  if (!url) { toast("请输入 MCP 服务 URL", true); return; }

  const authType = $('mcp-modal-auth-type').value;
  const config = {
    ...editingMcpConfig,
    name,
    description: $('mcp-modal-desc').value.trim(),
    url,
    authentication: authType ? { type: authType, bearer_token: $('mcp-modal-bearer-token').value.trim() } : null,
  };
  const enabled = $('mcp-modal-enabled').checked;

  const updating = !!editingMcpToolId;
  const res = editingMcpToolId
    ? await api('/v1/ai/mcp/app-tools/' + editingMcpToolId, { method: 'PUT', body: JSON.stringify({ config, enabled }) })
    : await api('/v1/ai/mcp/app-tools', { method: 'POST', body: JSON.stringify({ config, enabled }) });

  if (res.code === 200 && res.data) {
    closeMcpToolModal();
    await loadMcpTools();
    toast(updating ? WebI18n.t("工具已更新") : WebI18n.t("工具已创建"));
  } else {
    toast(WebI18n.errorMessage(res, editingMcpToolId ? WebI18n.t("更新失败") : WebI18n.t("创建失败")), true);
  }
}

async function deleteMcpTool(id) {
  if (!confirm(WebI18n.t("删除前请在所有角色中解除该 MCP 工具的引用。确定删除？"))) return;
  const res = await api('/v1/ai/mcp/app-tools/' + id, { method: 'DELETE' });
  if (res.code === 200) {
    mcpTools = mcpTools.filter(t => t.id !== id);
    if (selectedMcpTools.includes(id)) editorDirty = true;
    selectedMcpTools = selectedMcpTools.filter(x => x !== id);
    roleMcpCandidates = roleMcpCandidates.filter(x => x !== id);
    renderMcpTools();
    toast("已删除");
  } else {
    toast(WebI18n.errorMessage(res, WebI18n.t("删除失败")), true);
  }
}

// ── Device Plugins ──

async function loadPlugins() {
  try {
    const data = await api('/v1/ai/plugins');
    if (data.code !== 200 || !Array.isArray(data.data?.items)) throw new Error('plugin list unavailable');
    pluginTools = data.data.items;
    pluginLoadError = false;
  } catch {
    pluginLoadError = true;
    toast("设备插件列表加载失败，请稍后重试", true);
  }
  renderPlugins();
}

function renderPlugins() {
  const container = $('plugin-tools-list');
  const readonly = isEditingDefault;
  const defaultNames = readonly ? (defaultRole?.device_plugin_refs || []).filter(p => p.name) : [];
  const items = roleResourceItems([...pluginTools, ...defaultNames], selectedPlugins, readonly, rolePluginCandidates);
  if (!items.length) {
    container.innerHTML = '<span class="text-[11px] text-gray-400">' + (pluginLoadError ? WebI18n.mark("设备插件列表加载失败，请稍后重试") : readonly ? WebI18n.mark("未关联设备插件") : WebI18n.mark("暂无设备插件，点击下方新建")) + '</span>';
  } else {
    container.innerHTML = items.map(p => {
      const checked = selectedPlugins.includes(p.id);
      const bg = checked ? 'bg-emerald-500' : 'bg-gray-200';
      const dot = checked ? 'translate-x-3.5' : '';
      const op = readonly ? 'opacity-60' : 'cursor-pointer';
      return `
      <div class="flex items-center min-w-0 gap-1.5">
        <div class="flex items-center justify-between flex-1 min-w-0 ${op}" onclick="${readonly ? '' : escapeText('togglePlugin(' + JSON.stringify(p.id) + ')')}">
          <span class="text-[11px] text-gray-600 truncate flex-1 mr-1" title="${escapeText(p.name || WebI18n.t("名称暂不可用：") + p.id)}">${escapeText(p.name || p.id)}</span>
          ${readonly ? "<span class=\"text-[10px] text-gray-400 flex-shrink-0\"><span data-ui-i18n=\"已关联\">已关联</span></span>" : `<div class="relative w-8 h-[18px] rounded-full transition-colors flex-shrink-0 ${bg}">
            <div class="absolute top-0.5 left-0.5 w-3.5 h-3.5 rounded-full bg-white shadow-sm transition-transform ${dot}"></div>
          </div>`}
        </div>
        ${readonly || p.referenceOnly ? '' : `
        <button onclick="${escapeText('openPluginModal(' + JSON.stringify(p.id) + ')')}" class="text-[11px] text-emerald-600 hover:text-emerald-700 flex-shrink-0" title="编辑设备插件" data-ui-attrs="{&quot;title&quot;:&quot;编辑设备插件&quot;}" data-ui-i18n="编辑">编辑</button>
        <button onclick="${escapeText('deletePlugin(' + JSON.stringify(p.id) + ')')}" class="text-[11px] text-red-400 hover:text-red-600 flex-shrink-0" title="删除设备插件" data-ui-attrs="{&quot;title&quot;:&quot;删除设备插件&quot;}" data-ui-i18n="删除">删除</button>
        `}
      </div>`;
    }).join('');
    if (pluginLoadError) container.insertAdjacentHTML('beforeend', "<span class=\"text-[11px] text-gray-400\"><span data-ui-i18n=\"设备插件列表加载失败，请稍后重试\">设备插件列表加载失败，请稍后重试</span></span>");
  }
  // "+ 新建" button always visible (unless readonly)
  if (!isEditingDefault) {
    container.insertAdjacentHTML('beforeend', `<button onclick="openPluginModal()" class="text-[11px] text-emerald-600 hover:text-emerald-700 text-left mt-1 w-full" data-ui-i18n="+ 新建设备插件">+ 新建设备插件</button>`);
  }
}

function togglePlugin(pluginId) {
  if (isEditingDefault) return;
  const idx = selectedPlugins.indexOf(pluginId);
  if (idx >= 0) selectedPlugins.splice(idx, 1);
  else selectedPlugins.push(pluginId);
  editorDirty = true;
  renderPlugins();
}

// ── Device Plugin Modal ──

const PARAM_TYPES = ['string', 'integer', 'boolean', 'array', 'object'];

function paramRowsOf(tableId) {
  return tableId === 'input' ? pluginModalInputParams : pluginModalReturnParams;
}

function renderParamTable(tableId) {
  const rows = paramRowsOf(tableId);
  const tbody = $(`plugin-modal-${tableId}-params`);
  const showRequired = tableId === 'input';
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${showRequired ? 6 : 5}" class="text-center text-gray-400 py-3" data-ui-i18n="暂无参数">暂无参数</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((p, i) => `
    <tr class="border-t border-gray-100">
      <td class="p-1"><input type="text" value="${p.name || ''}" oninput="updateParamField('${tableId}', ${i}, 'name', this.value)" placeholder="仅字母、数字、下划线"
        class="w-full bg-gray-50 border border-gray-200 rounded px-2 py-1.5 text-[11px] outline-none focus:border-emerald-400" data-ui-attrs="{&quot;placeholder&quot;:&quot;仅字母、数字、下划线&quot;}"></td>
      <td class="p-1">
        <select onchange="updateParamField('${tableId}', ${i}, 'type', this.value)" class="w-full bg-gray-50 border border-gray-200 rounded px-1.5 py-1.5 text-[11px] outline-none focus:border-emerald-400 cursor-pointer">
          ${(p.type && !PARAM_TYPES.includes(p.type) ? [...PARAM_TYPES, p.type] : PARAM_TYPES).map(t => `<option value="${escapeText(t)}" ${p.type === t ? 'selected' : ''}>${escapeText(t)}</option>`).join('')}
        </select>
      </td>
      <td class="p-1"><input type="text" value="${p.description || ''}" oninput="updateParamField('${tableId}', ${i}, 'description', this.value)" placeholder="参数说明"
        class="w-full bg-gray-50 border border-gray-200 rounded px-2 py-1.5 text-[11px] outline-none focus:border-emerald-400" data-ui-attrs="{&quot;placeholder&quot;:&quot;参数说明&quot;}"></td>
      <td class="p-1"><input type="text" value="${p.default_value || ''}" oninput="updateParamField('${tableId}', ${i}, 'default_value', this.value)" placeholder="请输入"
        class="w-full bg-gray-50 border border-gray-200 rounded px-2 py-1.5 text-[11px] outline-none focus:border-emerald-400" data-ui-attrs="{&quot;placeholder&quot;:&quot;请输入&quot;}"></td>
      ${showRequired ? `<td class="p-1 text-center"><input type="checkbox" ${p.required ? 'checked' : ''} onchange="updateParamField('${tableId}', ${i}, 'required', this.checked)"></td>` : ''}
      <td class="p-1 text-center"><button onclick="removeParamRow('${tableId}', ${i})" class="text-red-400 hover:text-red-600" title="删除" data-ui-attrs="{&quot;title&quot;:&quot;删除&quot;}">&times;</button></td>
    </tr>
  `).join('');
}

function updateParamField(tableId, index, field, value) {
  paramRowsOf(tableId)[index][field] = value;
}

function addParamRow(tableId) {
  paramRowsOf(tableId).push({ name: '', type: 'string', description: '', default_value: '', required: false });
  renderParamTable(tableId);
}

function removeParamRow(tableId, index) {
  paramRowsOf(tableId).splice(index, 1);
  renderParamTable(tableId);
}

async function openPluginModal(id) {
  const request = ++pluginModalRequest;
  // List only carries {id,name}; fetch full detail (action, params, etc.) on demand.
  let p = null;
  if (id) {
    try {
      const res = await api('/v1/ai/plugins/' + encodeURIComponent(id));
      if (request !== pluginModalRequest) return;
      if (res.code !== 200 || !res.data) {
        toast(WebI18n.errorMessage(res, WebI18n.t("设备插件详情加载失败，请重试")), true);
        return;
      }
      p = res.data;
    } catch {
      if (request === pluginModalRequest) toast("设备插件详情加载失败，请检查网络后重试", true);
      return;
    }
  }
  editingPluginId = id || null;
  WebI18n.bindText($('plugin-modal-title'), () => (p ? WebI18n.t("编辑设备端插件") : WebI18n.t("新增设备端插件")), "textContent");
  WebI18n.bindText($('plugin-modal-submit-btn'), () => (p ? WebI18n.t("确认修改") : WebI18n.t("确认创建")), "textContent");
  $('plugin-modal-name').value = p?.name || '';
  $('plugin-modal-desc').value = p?.description || '';
  $('plugin-modal-action').value = p?.action || '';
  pluginModalInputParams = p?.input_params ? p.input_params.map(x => ({ ...x })) : [];
  pluginModalReturnParams = p?.return_params ? p.return_params.map(x => ({ ...x })) : [];
  renderParamTable('input');
  renderParamTable('return');
  $('plugin-modal').classList.remove('hidden');
  $('plugin-modal').classList.add('flex');
}

function closePluginModal() {
  pluginModalRequest += 1;
  $('plugin-modal').classList.add('hidden');
  $('plugin-modal').classList.remove('flex');
  editingPluginId = null;
}

function cleanParams(rows) {
  return rows.filter(p => (p.name || '').trim()).map(p => ({
    ...p,
    name: p.name.trim(),
    type: p.type || 'string',
    description: (p.description || '').trim(),
    default_value: (p.default_value || '').trim(),
    required: !!p.required,
  }));
}

async function savePluginModal() {
  const name = $('plugin-modal-name').value.trim();
  const action = $('plugin-modal-action').value.trim();
  if (!name) { toast("请输入插件名称", true); return; }
  if (!action) { toast("请输入功能标识（Action）", true); return; }

  const payload = {
    name,
    action,
    description: $('plugin-modal-desc').value.trim(),
    input_params: cleanParams(pluginModalInputParams),
    return_params: cleanParams(pluginModalReturnParams),
  };

  const updating = !!editingPluginId;
  const res = updating
    ? await api('/v1/ai/plugins/' + editingPluginId, { method: 'PUT', body: JSON.stringify(payload) })
    : await api('/v1/ai/plugins', { method: 'POST', body: JSON.stringify(payload) });

  if (res.code === 200 && res.data) {
    closePluginModal();
    await loadPlugins();
    toast(updating ? WebI18n.t("插件已更新") : WebI18n.t("插件已创建"));
  } else {
    toast(WebI18n.errorMessage(res, updating ? WebI18n.t("更新失败") : WebI18n.t("创建失败")), true);
  }
}

async function deletePlugin(id) {
  if (!confirm(WebI18n.t("删除前请先在引用该插件的角色中关闭它并保存角色。确定删除该插件？"))) return;
  const data = await api('/v1/ai/plugins/' + id, { method: 'DELETE' });
  if (data.code === 200) {
    pluginTools = pluginTools.filter(p => p.id !== id);
    if (selectedPlugins.includes(id)) editorDirty = true;
    selectedPlugins = selectedPlugins.filter(x => x !== id);
    rolePluginCandidates = rolePluginCandidates.filter(x => x !== id);
    renderPlugins();
    toast("已删除");
  } else {
    toast(WebI18n.errorMessage(data, WebI18n.t("删除失败")), true);
  }
}

function filterAgents() { renderAgentList(); }

// ── Bind button state ──
function updateBindButton() {
  const btn = $('btn-bind');
  const isEffective = currentAgentId === effectiveRoleId();
  btn.disabled = bindingRole || !currentAgentId || isEffective;
  if (!currentAgentId) {
    WebI18n.bindText(btn, () => (WebI18n.t("保存后再绑定")), "textContent");
    btn.classList.add('opacity-50', 'pointer-events-none');
  } else if (isEffective) {
    WebI18n.bindText(btn, () => (WebI18n.t("✓ 当前设备使用中")), "textContent");
    btn.classList.remove('opacity-50', 'pointer-events-none');
    btn.classList.add('!border-emerald-400', '!text-emerald-600');
  } else {
    WebI18n.bindText(btn, () => (WebI18n.t("绑定到此设备")), "textContent");
    btn.classList.remove('opacity-50', 'pointer-events-none', '!border-emerald-400', '!text-emerald-600');
  }
}

function updateHeaderBinding() {
  const roleId = effectiveRoleId();
  const a = agents.find(x => x.id === roleId);
  WebI18n.bindText($('header-role-name'), () => (a ? a.name : (roleId || WebI18n.t("未配置"))), "textContent");
}

// ── Actions ──
async function saveAgent() {
  if (savingRole || bindingRole) return;
  selectingRole += 1;
  savingRole = true;
  const button = $('btn-save');
  button.disabled = true;
  WebI18n.bindText(button, () => (WebI18n.t("保存中…")), "textContent");
  try {
    await persistAgent();
  } catch {
    toast("保存失败，请检查网络后重试，当前填写内容已保留", true);
  } finally {
    savingRole = false;
    button.disabled = isEditingDefault;
    WebI18n.bindText(button, () => (WebI18n.t("保存")), "textContent");
  }
}

async function persistAgent() {
  if (isEditingDefault) { toast("默认角色不可修改", true); return; }
  const name = $('field-name').value.trim();
  if (!name) { toast("请输入智能体名称", true); return; }
  if ([...name].length > 64) { toast("角色名称不能超过 64 个字符", true); return; }
  const promptText = $('field-prompt').value.trim();

  const previous = agents.find(agent => agent.id === currentAgentId) || {};
  const chosenVoice = voices.find(voice => voice.id === $('field-voice').value);
  const editsAliTTS = !previous.service_config?.type || previous.service_config.type === 'custom-compose';
  if (editsAliTTS && chosenVoice?.model && chosenVoice.model !== 'cosyvoice-v3-flash') {
    toast("当前音色不适用于阿里语音服务，请重新选择音色", true);
    return;
  }
  const payload = {
    name,
    avatar: previous.avatar || '',
    parent_role_id: previous.parent_role_id || '',
    agent_config: {
      ...previous.agent_config,
      prompt: promptText,
      welcome_text: $('field-welcome').value.trim(),
      ali_memory: { enable: $('field-memory').checked },
      mcp_tools: selectedMcpTools,
      device_plugins: selectedPlugins,
    },
    service_config: previous.service_config?.type && previous.service_config.type !== 'custom-compose' ? previous.service_config : {
      ...previous.service_config,
      name: previous.service_config?.name || 'default',
      type: 'custom-compose',
      config: {
        ...previous.service_config?.config,
        llm: {
          ...previous.service_config?.config?.llm,
          provider: 'ali-llm',
          provider_params: { ...previous.service_config?.config?.llm?.provider_params, model: $('field-model').value },
        },
        tts: {
          ...previous.service_config?.config?.tts,
          provider: 'ali-tts',
          provider_params: {
            ...previous.service_config?.config?.tts?.provider_params,
            model: chosenVoice?.model || previous.service_config?.config?.tts?.provider_params?.model || 'cosyvoice-v3-flash',
            voice: $('field-voice').value || undefined,
            rate: parseFloat($('field-rate').value),
            pitch: parseFloat($('field-pitch').value),
          },
        },
      },
    },
    user_params: {
      ...previous.user_params,
      description: $('field-desc').value.trim(),
      voice: $('field-voice').value || undefined,
    },
  };

  if (payload.service_config.type === 'custom-compose' && !$('field-model').value) {
    delete payload.service_config.config.llm;
  }
  if (payload.service_config.type === 'custom-compose' && !$('field-voice').value) {
    delete payload.service_config.config.tts;
  }

  const ragIdx = $('field-knowledge-index').value;
  payload.agent_config.ali_rag = ragIdx ? { index_id: ragIdx } : null;

  if (currentAgentId) {
    const res = await api('/v1/ai/roles/' + currentAgentId, { method: 'PUT', body: JSON.stringify(payload) });
    if (res.code === 200) {
      const updated = res.data;
      const idx = agents.findIndex(a => a.id === currentAgentId);
      if (idx >= 0 && updated) agents[idx] = { ...agents[idx], ...updated };
      toast("保存成功");
    } else {
      toast(WebI18n.errorMessage(res, WebI18n.t("保存失败")), true);
      return;
    }
  } else {
    const res = await api('/v1/ai/roles', { method: 'POST', body: JSON.stringify(payload) });
    if (res.code === 200 && res.data) {
      currentAgentId = res.data.id;
      agents.push(res.data);
      toast("创建成功");
    } else {
      toast(WebI18n.errorMessage(res, WebI18n.t("创建失败")), true);
      return;
    }
  }

  renderAgentList();
  editorDirty = false;
  updateHeaderBinding();
  $('btn-delete').classList.remove('hidden');
  updateBindButton();
}

async function deleteAgent() {
  if (savingRole || bindingRole) return;
  if (!currentAgentId) return;
  if (isEditingDefault) { toast("默认角色不可删除", true); return; }
  if (!confirm(WebI18n.t("确定要删除这个智能体吗？已绑定此角色的设备将恢复默认角色。"))) return;

  const res = await api('/v1/ai/roles/' + currentAgentId, { method: 'DELETE' });
  if (res.code === 200) {
    agents = agents.filter(a => a.id !== currentAgentId);
    if (boundRoleId === currentAgentId) {
      if (deviceId) await api('/v1/ai/device/' + deviceId + '/role', { method: 'DELETE' });
      boundRoleId = null;
    }
    currentAgentId = null;
    renderAgentList();
    updateHeaderBinding();
    editorDirty = false;
    newAgent();
    $('editor-form').classList.add('hidden');
    $('editor-empty').classList.remove('hidden');
    if (isMobile()) showList();
    toast("已删除");
  } else {
    toast(WebI18n.errorMessage(res, WebI18n.t("删除失败")), true);
  }
}

async function bindToDevice() {
  if (savingRole || bindingRole) return;
  if (!currentAgentId || currentAgentId === effectiveRoleId()) return;
  if (!deviceId) { toast("未指定设备", true); return; }
  if (editorDirty) { toast("请先保存角色修改", true); return; }

  bindingRole = true;
  selectingRole += 1;
  $('btn-bind').disabled = true;
  try {
    const selectingDefault = isDefaultRole(currentAgentId);
    const res = await api('/v1/ai/device/' + encodeURIComponent(deviceId) + '/role', selectingDefault ? {
      method: 'DELETE',
    } : {
      method: 'PUT',
      body: JSON.stringify({ role_id: currentAgentId }),
    });
    if (res.code === 200) {
      boundRoleId = selectingDefault ? '' : currentAgentId;
      updateHeaderBinding();
      renderAgentList();
      updateBindButton();
      toast(selectingDefault ? WebI18n.t("已恢复默认角色") : WebI18n.t("绑定成功"));
    } else {
      toast(WebI18n.errorMessage(res, WebI18n.t("绑定失败")), true);
    }
  } catch {
    toast("设置失败，请检查网络后重试", true);
  } finally {
    bindingRole = false;
    updateBindButton();
  }
}

$('editor-form').addEventListener('input', () => { editorDirty = true; });
$('editor-form').addEventListener('change', () => { editorDirty = true; });
window.addEventListener('beforeunload', event => {
  if (!editorDirty) return;
  event.preventDefault();
  event.returnValue = '';
});

function initializePage() {
  init().catch(() => {
    $('agent-list').replaceChildren();
    const message = document.createElement('p');
    WebI18n.bindText(message, () => (WebI18n.t("角色加载失败，请检查网络后重试")), "textContent");
    message.style.cssText = 'padding:32px 16px;text-align:center;color:#666666;font-size:14px';
    const retry = document.createElement('button');
    WebI18n.bindText(retry, () => (WebI18n.t("重新加载")), "textContent");
    retry.style.cssText = 'display:block;margin:0 auto;padding:12px 24px;border-radius:12px;background:#07C160;color:white';
    retry.onclick = initializePage;
    $('agent-list').append(message, retry);
  });
}
initializePage();
</script>
</body>
</html>
