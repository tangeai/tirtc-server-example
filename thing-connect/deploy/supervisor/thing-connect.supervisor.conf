stderr_logfile=/opt/thing-connect/logs/%(program_name)s.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/opt/thing-connect/logs/%(program_name)s.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
stopasgroup=true
killasgroup=true

; 其他业务服务的第二个实例按同样方式添加，下面以 user-server-2 为例。约定端口为
; 主实例端口加 10：user 9012、voip 9013、ai 9014、call 9015、recognition 9016。
; 除 ai-server 外，<服务>/mqtt.connection 必须使用 username 认证方式。复制时保留
; 原程序的 priority 和 autostart，加入 [group:thing-connect] 的 programs，并在 Nginx
; 对应 upstream 中加入 server 127.0.0.1:<端口> max_fails=0;；user 调用 ai/voip/call 内部接口时改走 Nginx 内网入口。
;[program:user-server-2]
;priority=20
;directory=/opt/thing-connect/user-server
;command=/opt/thing-connect/user-server/user-server -c /opt/thing-connect/user-server/config.yaml
;autostart=true
;autorestart=true
;startretries=5
;startsecs=3
;stopwaitsecs=50
;environment=GIN_MODE="release",SERVICE_INSTANCE_ID="user-server-002",THING_CONNECT_HTTP_PORT="9012"
;stderr_logfile=/opt/thing-connect/logs/%(program_name)s.err.log
;stderr_logfile_maxbytes=50MB
;stderr_logfile_backups=10
;stdout_logfile=/opt/thing-connect/logs/%(program_name)s.out.log
;stdout_logfile_maxbytes=50MB
;stdout_logfile_backups=10
;user=root
;stopasgroup=true
;killasgroup=true

