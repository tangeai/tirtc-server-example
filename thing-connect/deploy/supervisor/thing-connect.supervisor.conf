[program:device-server]
priority=20
directory=/opt/thing-connect/device-server
command=/opt/thing-connect/device-server/device-server -c /opt/thing-connect/device-server/config.yaml
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
environment=GIN_MODE="release",SERVICE_INSTANCE_ID="device-server-001"
stderr_logfile=/opt/thing-connect/logs/%(program_name)s.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/opt/thing-connect/logs/%(program_name)s.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
stopasgroup=true
killasgroup=true

; device-server 第二个实例（可选）。启用前 device-server/mqtt.connection 必须使用
; username 认证方式；各实例的 SERVICE_INSTANCE_ID 和 THING_CONNECT_HTTP_PORT 不能重复。
; 取消下面整段注释，把 device-server-2 加入 [group:thing-connect] 的 programs，
; 并在 Nginx 的 device_server upstream 中加入 server 127.0.0.1:9011 max_fails=0;。
;[program:device-server-2]
;priority=20
;directory=/opt/thing-connect/device-server
;command=/opt/thing-connect/device-server/device-server -c /opt/thing-connect/device-server/config.yaml
;autostart=true
;autorestart=true
;startretries=5
;startsecs=3
;stopwaitsecs=15
;environment=GIN_MODE="release",SERVICE_INSTANCE_ID="device-server-002",THING_CONNECT_HTTP_PORT="9011"
;stderr_logfile=/opt/thing-connect/logs/%(program_name)s.err.log
;stderr_logfile_maxbytes=50MB
;stderr_logfile_backups=10
;stdout_logfile=/opt/thing-connect/logs/%(program_name)s.out.log
;stdout_logfile_maxbytes=50MB
;stdout_logfile_backups=10
;user=root
;stopasgroup=true
;killasgroup=true

