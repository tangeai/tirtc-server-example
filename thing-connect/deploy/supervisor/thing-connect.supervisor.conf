[program:device-server]
directory=/opt/thing-connect/device-server
command=/opt/thing-connect/device-server/device-server -c /opt/thing-connect/device-server/config.yaml
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
environment=GIN_MODE="release",SERVICE_INSTANCE_ID="device-server-001"
stderr_logfile=/opt/thing-connect/logs/%(program_name)s.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/opt/thing-connect/logs/%(program_name)s.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
stopasgroup=true
killasgroup=true

