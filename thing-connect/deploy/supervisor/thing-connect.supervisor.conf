directory=/opt/thing-connect/recognition-server
command=/opt/thing-connect/recognition-server/recognition-server -c /opt/thing-connect/recognition-server/config.yaml
autostart=false
autorestart=true
startretries=5
startsecs=3
; 退出时等待已发出的模型调用完成（最长 90 秒），避免任务变为 unknown。
stopwaitsecs=100
environment=GIN_MODE="release",SERVICE_INSTANCE_ID="recognition-server-001"
stderr_logfile=/opt/thing-connect/logs/%(program_name)s.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/opt/thing-connect/logs/%(program_name)s.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
stopasgroup=true
killasgroup=true

[program:admin-server]
priority=10
directory=/opt/thing-connect/admin-server
command=/opt/thing-connect/admin-server/admin-server -c /opt/thing-connect/admin-server/config.yaml -deploy-root /opt/thing-connect -setup-bind 127.0.0.1 -setup-port 9000 -supervisor-group thing-connect
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
environment=GIN_MODE="release",SERVICE_INSTANCE_ID="admin-server-001"
stderr_logfile=/opt/thing-connect/logs/%(program_name)s.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/opt/thing-connect/logs/%(program_name)s.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
stopasgroup=true
killasgroup=true

[group:thing-connect]
programs=admin-server,device-server,user-server,voip-server,ai-server,call-server,recognition-server
