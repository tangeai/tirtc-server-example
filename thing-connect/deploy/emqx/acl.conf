%% EMQX 文件授权（acl.conf）— thing-connect 完整规则，可直接作为 EMQX 当前生效的文件授权源。
%%
%% 认证链顺序：内置数据库（先）→ JWT（后）
%%   - 内置数据库：服务端进程账号（devicesrv_main / usrsrv_main / voipsrv_main / callsrv_main / recognition_main）
%%   - JWT：设备连接（temp_token / mqtt_token）
%%
%% 部署前确认：
%%   - 内置数据库中的服务账号与各服务在 Admin 发布的 MQTT 用户名一致；用户名不同时同步替换下方规则
%%   - JWT 认证 Secret 与各业务服务 jwt_secret 一致，"Secret 使用 Base64 编码" 关闭
%%   - JWT 认证 verify_claims 至少包含 device_id = "${username}"；设备规则依赖 Username 已由 JWT 核对
%%   - authorization.no_match = deny
%%   - 服务账号使用专用用户名，不能与设备用户名重合。来源 IP 不参与授权。
%%
%% 规则自上而下匹配，命中即停止。

%% 1. Dashboard
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

%% 2. 业务服务。设备在线事件由 Device 消费，User 绑定设备时订阅对应 ACK。
{allow, {username, "devicesrv_main"}, subscribe, ["device/+/up", "$SYS/brokers/+/clients/+/connected", "$SYS/brokers/+/clients/+/disconnected"]}.
{allow, {username, "usrsrv_main"}, publish, ["device/+/cmd"]}.
{allow, {username, "usrsrv_main"}, subscribe, ["device/+/ack"]}.
{allow, {username, "voipsrv_main"}, publish, ["device/+/cmd", "device/+/notify"]}.
{allow, {username, "callsrv_main"}, publish, ["device/+/cmd", "device/+/notify"]}.
{allow, {username, "recognition_main"}, publish, ["device/+/notify"]}.

%% 3. 其他客户端禁止订阅系统主题和全量主题
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

%% 4a. 临时连接 老固件（mac_*）：按 ClientID 限定自己的主题
{allow, {clientid, {re, "^mac_"}}, subscribe, ["device/${clientid}/cmd"]}.
{allow, {clientid, {re, "^mac_"}}, publish,   ["device/${clientid}/ack", "device/${clientid}/up"]}.

%% 4b. 临时连接 新固件（tmp_*）：ClientID = Username = temp_client_id，按已认证的 Username 限定自己的主题
{allow, {'and', [{clientid, {re, "^tmp_"}}, {username, {re, "^tmp_[^/+#]+$"}}]}, subscribe, ["device/${username}/cmd"]}.
{allow, {'and', [{clientid, {re, "^tmp_"}}, {username, {re, "^tmp_[^/+#]+$"}}]}, publish,   ["device/${username}/ack", "device/${username}/up"]}.

%% 5. 正式连接（sn_*）：ClientID = sn_{device_id}，Username = device_id，只允许自己的 4 个主题
{allow, {'and', [{clientid, {re, "^sn_"}}, {username, {re, "^[^/+#]+$"}}]}, subscribe, ["device/sn_${username}/cmd", "device/sn_${username}/notify"]}.
{allow, {'and', [{clientid, {re, "^sn_"}}, {username, {re, "^[^/+#]+$"}}]}, publish,   ["device/sn_${username}/ack", "device/sn_${username}/up"]}.

%% 6. 默认拒绝
{deny, all}.
