[program:device-server]
directory=/data/mqtt-demo.tange-ai.com/device-server
command=/data/mqtt-demo.tange-ai.com/device-server/device-server -c /data/mqtt-demo.tange-ai.com/device-server/config.yaml
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
environment=GIN_MODE="release"
stderr_logfile=/data/mqtt-demo.tange-ai.com/logs/%(program_name)s.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/data/mqtt-demo.tange-ai.com/logs/%(program_name)s.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
stopasgroup=true
killasgroup=true

