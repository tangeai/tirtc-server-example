<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="/static/favicon.ico?v=1" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <script src="/static/js/mini-program-page.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>实时查看 — 探鸽 · 小钛</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <style>
    html, body { margin: 0; padding: 0; background: #000; color: #fff; height: 100%; overflow: hidden; }
    #video-wrap { position: relative; width: 100%; background: #000; }
    #canvas {
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center;
    }
    #canvas-box {
      position: relative;
      overflow: hidden; /* clip the rotated canvas's horizontal overflow for 90/270 */
      aspect-ratio: var(--video-ratio, 16/9);
      margin: 0 auto;
      max-width: min(100%, calc((100vh - 160px) * var(--video-ratio, 16/9))); /* keep portrait ratios inside the viewport */
    }
    #talk-btn {
      transition: background 0.15s, transform 0.1s;
      -webkit-user-select: none; user-select: none;
    }
    #talk-btn.active {
      background: #ef4444 !important;
      transform: scale(0.97);
    }
    .mini-program #topbar, .mini-program #video-wrap > .md\:flex { display: none; }
    #player-feedback { padding: 20px 24px; color: #c7d1cc; font: 14px/1.7 system-ui; text-align: center; }
    #player-retry { margin: 12px auto; border: 0; border-radius: 12px; padding: 12px 28px; background: #07C160; color: white; }
    @media (min-width: 900px) {
      body { background: #111; }
      #video-wrap { max-width: 1100px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
    }
  </style>
  <script src="/static/user-shell.js?v=a3b29baae127"></script>
</head>
<body>
<!-- TOPBAR (mobile only) -->
<div id="topbar" class="flex items-center gap-3 px-4 py-3 bg-[#111] border-b border-white/10 md:hidden">
  <button onclick="history.back()" class="p-1 text-white/60 hover:text-white">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>
  <span id="page-title" class="text-sm font-medium truncate flex-1 text-white/90"></span>
  <div id="status-dot" class="w-2 h-2 rounded-full bg-gray-500 flex-shrink-0"></div>
</div>

<div id="layout">
  <!-- VIDEO -->
  <div id="video-wrap">
    <!-- PC topbar inside video area -->
    <div class="hidden md:flex items-center gap-3 px-4 py-3 bg-[#1a1a1a]">
      <button onclick="history.back()" class="p-1 text-white/50 hover:text-white transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <span id="page-title-pc" class="text-sm font-medium text-white/80 flex-1 truncate"></span>
      <div id="status-dot-pc" class="w-2 h-2 rounded-full bg-gray-500"></div>
      <span id="status-text-pc" class="text-xs text-white/40">连接中…</span>
    </div>
    <div id="canvas-box">
      <canvas id="canvas" style="background:#000; display:block; width:100%; height:100%;"></canvas>
      <div id="audio-unlock" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); pointer-events:none; align-items:center; justify-content:center; flex-direction:column; gap:8px;">
        <svg style="width:40px;height:40px;opacity:0.9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <span style="color:white;font-size:13px;opacity:0.85">点击开启声音</span>
      </div>
    </div>

    <!-- Bottom bar: quality + talk + mute -->
    <div class="flex items-center gap-2 px-3 py-2 bg-[#111]">
      <div class="flex-1"></div>
      <button id="talk-btn"
        class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-white/10 border border-white/15 text-xs font-medium text-white/80 transition-all"
        onmousedown="startTalk()" onmouseup="stopTalk()"
        ontouchstart="startTalk(event)" ontouchend="stopTalk(event)" ontouchcancel="stopTalk(event)" onmouseleave="stopTalk(event)">
        <span id="talk-dot" class="w-1.5 h-1.5 rounded-full bg-white/30"></span>
        <span id="talk-label">按住说话</span>
      </button>
      <button id="btn-mute" onclick="toggleMute()"
        class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center transition-all">
        <svg id="icon-sound" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg id="icon-mute" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="player-feedback" role="status">
  <p id="player-message">正在连接设备…</p>
  <button id="player-retry" hidden>重新连接</button>
</div>
<script type="module">
import { TiRtc, TiRtcInitOptions, TiRtcConn, TiRtcVideoOutput, TiRtcAudioOutput, TiRtcAudioInput } from '/static/js/tirtc.es.min.js';

const $ = id => document.getElementById(id);

const jwtToken = window.MiniProgramPage.token;
if (!jwtToken) window.MiniProgramPage.requireLogin();

const params   = new URLSearchParams(location.search);
const deviceID = params.get('device_id') || '';

const LEGACY_STREAM_IDS = Object.freeze({
  upAudio: 10,
  upVideo: 11,
  downAudio: 14,
});

function streamId(profile, key, fallback) {
  const value = profile?.[key];
  return Number.isInteger(value) && value >= 0 && value <= 15 ? value : fallback;
}

function resolveStreamIds(profile) {
  return {
    upAudio: streamId(profile, 'up_audio_streamid', LEGACY_STREAM_IDS.upAudio),
    upVideo: streamId(profile, 'up_video_streamid', LEGACY_STREAM_IDS.upVideo),
    downAudio: streamId(profile, 'down_audio_streamid', LEGACY_STREAM_IDS.downAudio),
  };
}

// ── Page title ────────────────────────────────────────────────────────────
const titleText = deviceID ? `${deviceID} 实时查看` : '实时查看';
document.title = titleText;
['page-title','page-title-pc'].forEach(id => {
  const el = $(id);
  if (el) el.textContent = titleText;
});

function setStatus(online) {
  const color = online ? '#10b981' : '#6b7280';
  ['status-dot','status-dot-pc'].forEach(id => {
    const el = $(id);
    if (el) el.style.background = color;
  });
  const st = $('status-text-pc');
  if (st) st.textContent = online ? '已连接' : '连接中…';
}

// ── Fetch RTC token ───────────────────────────────────────────────────────
async function fetchRtcToken() {
  const res = await fetch(`/v1/user/device/rtc-token?device_id=${encodeURIComponent(deviceID)}`, {
    headers: { 'Authorization': 'Bearer ' + jwtToken },
    signal: requestController.signal,
  });
  const d = await res.json();
  if (d.code === 401) window.MiniProgramPage.requireLogin();
  if (d.code !== 200) throw new Error(d.msg || '连接暂时不可用，请稍后重试');
  return {
    rtcToken: d.data.token,
    appId: d.data.app_id,
    endpoint: d.data.endpoint,
    streamProfile: d.data.profiles?.stream ?? null,
  };
}

// ── Canvas presentation (stream scene) ────────────────────────────────────
const DEFAULT_ASPECT_RATIO = 16 / 9;
function parseAspectRatio(value) {
  // number (positive) or "w:h" (1-9999 each); anything else → 16:9 default.
  if (typeof value === 'number' && Number.isFinite(value) && value > 0) return value;
  if (typeof value === 'string') {
    const m = /^(\d+):(\d+)$/.exec(value.trim());
    if (m) {
      const w = Number(m[1]), h = Number(m[2]);
      if (w >= 1 && h >= 1 && w <= 9999 && h <= 9999) return w / h;
    }
    const n = Number(value);
    if (Number.isFinite(n) && n > 0) return n;
  }
  return DEFAULT_ASPECT_RATIO;
}

function applyVideoPresentation(stream) {
  const s = stream || {};
  const canvas = $('canvas');
  const box = $('canvas-box');

  const ratio = parseAspectRatio(s.aspect_ratio);
  const rotation = [0, 90, 180, 270].includes(s.camera_rotation) ? s.camera_rotation : 0;
  const swap = rotation === 90 || rotation === 270;
  // Swap the box ratio for 90/270: the raw landscape frame occupies a
  // portrait box and the rotate() transform turns it upright.
  const displayRatio = swap ? 1 / ratio : ratio;
  box.style.setProperty('--video-ratio', String(displayRatio));

  // A 90/270-degree transform swaps the element's visual bounds. Size the
  // unrotated canvas to the inverse dimensions of its box so the rotated
  // result fills that box without clipping or letterboxing twice.
  canvas.style.width = swap ? `${100 / displayRatio}%` : '100%';
  canvas.style.height = swap ? `${100 * displayRatio}%` : '100%';

  canvas.style.objectFit = ['fill', 'contain', 'cover'].includes(s.object_fit) ? s.object_fit : 'contain';

  // Rightmost transform applies first (element-local/frame space), so the
  // mirrors act on the raw camera frame and the mirrored frame is then
  // rotated into display orientation. Mirror fields describe the camera.
  const parts = ['translate(-50%, -50%)'];
  if (rotation) parts.push(`rotate(${rotation}deg)`);
  if (s.hor_mirror === true) parts.push('scaleX(-1)');
  if (s.vert_mirror === true) parts.push('scaleY(-1)');
  canvas.style.transform = parts.join(' ');
}

// ── Player ────────────────────────────────────────────────────────────────
let connection      = null;
let audioOutput     = null;
let videoOutput     = null;
let audioInput      = null;
let muted           = true;   // user gesture creates/resumes browser audio output
let talking         = false;  // prevent double-start
let starting        = false;
let generation      = 0;
let connected       = false;
let startTimeout    = null;
let requestController = null;
let subscribedAudioStreamId = null;
let subscribedVideoStreamId = null;
let configuredAudioStreamId = null;

function showFailure(message) {
  $('player-message').textContent = message;
  $('player-retry').hidden = false;
  setStatus(false);
}

async function start() {
  if (starting || !jwtToken || !deviceID) return;
  cleanup();
  const attempt = generation;
  starting = true;
  requestController = new AbortController();
  startTimeout = setTimeout(() => {
    if (attempt !== generation) return;
    cleanup();
    showFailure('连接超时，请检查设备和手机网络后重试');
  }, 20000);
  $('player-message').textContent = '正在连接设备…';
  $('player-retry').hidden = true;
  try {
    const { rtcToken, appId, streamProfile } = await fetchRtcToken();
    if (attempt !== generation) return;
    applyVideoPresentation(streamProfile);
    const {
      upAudio: upAudioStreamId,
      upVideo: upVideoStreamId,
      downAudio: downAudioStreamId,
    } = resolveStreamIds(streamProfile);
    configuredAudioStreamId = upAudioStreamId;

    TiRtc.initialize(TiRtcInitOptions({ appId:appId }));

    // Wait for wasm to load
    await TiRtc.videoOutputReady();
    if (attempt !== generation) return;

    connection  = new TiRtcConn();
    audioOutput = TiRtcAudioOutput({ connection, streamId: upAudioStreamId });
    videoOutput = TiRtcVideoOutput({ connection, streamId: upVideoStreamId });
    audioInput  = new TiRtcAudioInput({ connection, streamId: downAudioStreamId });
    audioInput.setOptions({ sampleRate: 8000 });

    await connection.connect({ deviceId: deviceID, token: rtcToken });
    if (attempt !== generation) return;
    connected = true;
    setStatus(true);
    videoOutput.attach();
    if (!muted) audioOutput.attach();
    subscribedVideoStreamId = upVideoStreamId;
    connection.subscribeVideo({ streamId: upVideoStreamId });
    if (!muted) {
      subscribedAudioStreamId = upAudioStreamId;
      connection.subscribeAudio({ streamId: upAudioStreamId });
    }
    updateMuteUI();
    $('player-message').textContent = '已连接 · 点击声音按钮开启或关闭声音';

  } catch(e) {
    if (attempt !== generation) return;
    cleanup();
    showFailure('暂时无法连接，请确认设备在线后重试');
  } finally {
    if (attempt === generation) {
      starting = false;
      clearTimeout(startTimeout);
    }
  }
}

function updateMuteUI() {
  $('icon-sound').classList.toggle('hidden', muted);
  $('icon-mute').classList.toggle('hidden', !muted);
  $('btn-mute').classList.toggle('bg-red-500/60', muted);
}


// ── Mute ─────────────────────────────────────────────────────────────────
window.toggleMute = function() {
  muted = !muted;
  if (audioOutput && connection && connected) {
    if (muted) {
      if (subscribedAudioStreamId !== null) {
        connection.unsubscribeAudio({ streamId: subscribedAudioStreamId });
        subscribedAudioStreamId = null;
      }
      audioOutput.detach();
    } else {
      audioOutput.attach();
      subscribedAudioStreamId = configuredAudioStreamId;
      connection.subscribeAudio({ streamId: configuredAudioStreamId });
    }
  }
  updateMuteUI();
};

// ── Talk ─────────────────────────────────────────────────────────────────
window.startTalk = function(e) {
  if (e) e.preventDefault();
  if (!audioInput || talking || !connected) return;
  const input = audioInput;
  const attempt = generation;
  talking = true;
  $('talk-btn').classList.add('active');
  $('talk-dot').style.background = '#ef4444';
  $('talk-label').textContent = '说话中…';
  input.start().then(() => {
    if (attempt !== generation || !talking) { input.stop(); return; }
    return input.attach();
  }).catch(() => {
    if (attempt !== generation) return;
    talking = false;
    $('talk-btn').classList.remove('active');
    $('talk-dot').style.background = 'rgba(255,255,255,0.3)';
    $('talk-label').textContent = '麦克风失败';
  });
};

window.stopTalk = function(e) {
  if (e) e.preventDefault();
  if (!talking) return;
  talking = false;
  $('talk-btn').classList.remove('active');
  $('talk-dot').style.background = 'rgba(255,255,255,0.3)';
  $('talk-label').textContent = '按住说话';
  if (audioInput) audioInput.stop();
};

function cleanup() {
  generation += 1;
  starting = false;
  connected = false;
  clearTimeout(startTimeout);
  if (requestController) requestController.abort();
  requestController = null;
  window.stopTalk();
  if (connection && subscribedVideoStreamId !== null) {
    connection.unsubscribeVideo({ streamId: subscribedVideoStreamId });
  }
  if (connection && subscribedAudioStreamId !== null) {
    connection.unsubscribeAudio({ streamId: subscribedAudioStreamId });
  }
  subscribedVideoStreamId = null;
  subscribedAudioStreamId = null;
  if (audioOutput) audioOutput.detach();
  if (videoOutput) videoOutput.detach();
  if (audioInput) {
    audioInput.stop();
    void audioInput.detach().catch(() => {});
  }
  if (connection) connection.disconnect();
  connection = audioOutput = videoOutput = audioInput = null;
  configuredAudioStreamId = null;
}

$('player-retry').onclick = start;
window.addEventListener('pagehide', cleanup);
window.addEventListener('beforeunload', cleanup);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cleanup();
    showFailure('播放已暂停，点击重新连接继续查看');
  }
});

if (deviceID) start();
else showFailure('未找到设备，请返回设备列表重新打开');
</script>
</body>
</html>
