<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThingConnect</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <!-- 网易易盾验证码 SDK（配置了 captcha_id 时生效） -->
  <script src="https://cstaticdun.126.net/load.min.js"></script>
  <style>
    /* 易盾 popup 弹层修复：挂载点放在 fixed 层，但 SDK 容器宽高为 0 导致遮罩失效。
       强制 popup 容器和遮罩层撑满视口，确保弹窗正常显示并拦截背景点击。 */
    .yidun_popup {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
    }
    .yidun_popup__mask {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    .yidun_cover-frame {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>

<script>
const $ = id => document.getElementById(id);
// ── Canvas node animation ─────────────────────────────────────────────────
const canvas = $('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NODE_COUNT = 38;
const nodes = [];

function randBetween(a, b) { return a + Math.random() * (b - a); }

for (let i = 0; i < NODE_COUNT; i++) {
  const type = i < 4 ? 2 : i < 12 ? 1 : 0;
  const xBase = i < NODE_COUNT * 0.6 ? randBetween(0.04, 0.62) : randBetween(0.04, 0.55);
  nodes.push({
    x: xBase * window.innerWidth,
    y: randBetween(0.05, 0.95) * window.innerHeight,
    vx: randBetween(-0.18, 0.18),
    vy: randBetween(-0.12, 0.12),
    r: type === 2 ? 5 : type === 1 ? 3.5 : 2,
    type,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: randBetween(0.02, 0.05),
  });
}

const HUB_X = 0.44;
const hubs = [
  { x: HUB_X * window.innerWidth, y: 0.38 * window.innerHeight, r: 7, label: 'MQTT' },
  { x: (HUB_X - 0.08) * window.innerWidth, y: 0.58 * window.innerHeight, r: 5, label: 'Redis' },
  { x: (HUB_X + 0.05) * window.innerWidth, y: 0.64 * window.innerHeight, r: 5, label: 'DB' },
];

const ACCENT  = '#00D4AA';
const ACCENT2 = '#3B82F6';
const MAX_DIST = 160;

let frame = 0;

function draw() {
  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  nodes.forEach(n => {
    n.x += n.vx;
    n.y += n.vy;
    n.pulse += n.pulseSpeed;
    if (n.x < 0 || n.x > canvas.width  * 0.65) n.vx *= -1;
    if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
  });

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d < MAX_DIST) {
        const alpha = (1 - d / MAX_DIST) * 0.25;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.strokeStyle = `rgba(0,212,170,${alpha})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }
  }

  hubs.forEach(hub => {
    nodes.forEach(n => {
      const dx = n.x - hub.x;
      const dy = n.y - hub.y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d < MAX_DIST * 1.4) {
        const alpha = (1 - d / (MAX_DIST * 1.4)) * 0.35;
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(hub.x, hub.y);
        ctx.strokeStyle = `rgba(59,130,246,${alpha})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    });
  });

  nodes.forEach(n => {
    const pulse = (Math.sin(n.pulse) + 1) / 2;
    const alpha = 0.4 + pulse * 0.5;

    if (n.type >= 1) {
      const ringR = n.r + 4 + pulse * 6;
      ctx.beginPath();
      ctx.arc(n.x, n.y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,212,170,${0.08 + pulse * 0.08})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);

    if (n.type === 2) {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      g.addColorStop(0, `rgba(0,212,170,${alpha})`);
      g.addColorStop(1, `rgba(0,212,170,0)`);
      ctx.fillStyle = g;
    } else if (n.type === 1) {
      ctx.fillStyle = `rgba(0,212,170,${alpha * 0.8})`;
    } else {
      ctx.fillStyle = `rgba(136,180,220,${alpha * 0.6})`;
    }
    ctx.fill();
  });

  hubs.forEach((hub, i) => {
    const pulseA = (Math.sin(frame * 0.025 + i * 1.1) + 1) / 2;

    const ringR = hub.r + 6 + pulseA * 10;
    ctx.beginPath();
    ctx.arc(hub.x, hub.y, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,212,170,${0.06 + pulseA * 0.1})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(hub.x, hub.y, hub.r + 4, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,212,170,0.25)`;
    ctx.lineWidth = 1;
    ctx.stroke();

    const g = ctx.createRadialGradient(hub.x, hub.y, 0, hub.x, hub.y, hub.r);
    g.addColorStop(0, '#00D4AA');
    g.addColorStop(1, 'rgba(0,212,170,0.2)');
    ctx.beginPath();
    ctx.arc(hub.x, hub.y, hub.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    const lw = hub.label.length * 7.5 + 16;
    const lx = hub.x + hub.r + 8;
    const ly = hub.y - 10;
    ctx.fillStyle = 'rgba(0,20,16,0.75)';
    roundRect(ctx, lx, ly, lw, 20, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,212,170,0.4)';
    ctx.lineWidth = 0.8;
    roundRect(ctx, lx, ly, lw, 20, 4);
    ctx.stroke();
    ctx.fillStyle = ACCENT;
    ctx.font = '500 11px JetBrains Mono, monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText(hub.label, lx + 8, ly + 10);
  });

  if (frame % 3 === 0) {
    const src = nodes[Math.floor(Math.random() * nodes.length)];
    const dst = hubs[Math.floor(Math.random() * hubs.length)];
    const t = (frame % 120) / 120;
    const px = src.x + (dst.x - src.x) * t;
    const py = src.y + (dst.y - src.y) * t;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,212,170,0.7)';
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

draw();

// ── Captcha (网易易盾) ────────────────────────────────────────────────────
// CAPTCHA_ID 从后端 /v1/config/captcha 获取，未配置时为空字符串走 dev 模式
let CAPTCHA_ID = '90d9c7ccb6d34236ad03fddf48011322';
let loginCaptchaToken = null;   // { captcha_id, validate, user }
let regCaptchaToken   = null;

async function initCaptchaId() {
  try {
    const res = await fetch('/v1/config/captcha');
    if (!res.ok) return;
    const d = await res.json();
    if (d.data && d.data.captcha_id) CAPTCHA_ID = d.data.captcha_id;
  } catch (_) {}
  if (CAPTCHA_ID) setupCaptcha();
}

let loginCaptchaIns = null;
let regCaptchaIns   = null;
let loginCaptchaInited = false;
let regCaptchaInited   = false;
// 注册流：验证通过后自动触发的回调
let _regSendAfterVerify = null;

function initCaptchaInstance(elementId, onVerified, onInstance) {
  window.initNECaptcha(
    {
      captchaId: CAPTCHA_ID,
      element: '#' + elementId,
      mode: 'popup',
      width: Math.min(320, window.innerWidth - 24) + 'px',
      apiVersion: 2,
      onVerify(err, data) {
        if (err) return;
        onVerified({ captcha_id: CAPTCHA_ID, validate: data.validate, user: '' });
      },
    },
    function onload(instance) { onInstance(instance); },
    function onerror(err) { console.warn('captcha init error', err); }
  );
}

function setupLoginCaptcha() {
  if (loginCaptchaInited) return;
  if (!window.initNECaptcha) { setTimeout(setupLoginCaptcha, 100); return; }
  loginCaptchaInited = true;
  initCaptchaInstance('login-captcha-wrap',
    tok => {
      loginCaptchaToken = tok;
      _submitLoginWithToken(tok);
    },
    ins => { loginCaptchaIns = ins; }
  );
}

function setupRegCaptcha() {
  if (regCaptchaInited) return;
  if (!window.initNECaptcha) { setTimeout(setupRegCaptcha, 100); return; }
  regCaptchaInited = true;
  initCaptchaInstance('reg-captcha-wrap',
    tok => {
      regCaptchaToken = tok;
      if (_regSendAfterVerify) { const fn = _regSendAfterVerify; _regSendAfterVerify = null; fn(tok); }
    },
    ins => { regCaptchaIns = ins; }
  );
}

function setupCaptcha() {
  setupLoginCaptcha();
  // 注册验证码在切 tab 时初始化
}

// Returns { captcha_id, validate, user } — empty strings when running in dev mode
function getCaptchaToken(which) {
  if (!CAPTCHA_ID) return { captcha_id: '', validate: '', user: '' };
  return which === 'login' ? (loginCaptchaToken || null) : (regCaptchaToken || null);
}

// ── Auth logic ────────────────────────────────────────────────────────────
function switchTab(tab) {
  const isLogin = tab === 'login';
  $('form-login').classList.toggle('hidden', !isLogin);
  $('form-register').classList.toggle('hidden', isLogin);
  $('tab-login').className    = 'flex-1 py-2 text-[13px] font-medium rounded-[7px] cursor-pointer border transition-all ' + (isLogin ? 'bg-[rgba(0,212,170,0.15)] text-[#00D4AA] border-[rgba(0,212,170,0.3)]' : 'border-transparent text-[#8896B3] hover:text-[#F0F4FF]');
  $('tab-register').className = 'flex-1 py-2 text-[13px] font-medium rounded-[7px] cursor-pointer border transition-all ' + (!isLogin ? 'bg-[rgba(0,212,170,0.15)] text-[#00D4AA] border-[rgba(0,212,170,0.3)]' : 'border-transparent text-[#8896B3] hover:text-[#F0F4FF]');
  $('card-title').textContent = isLogin ? '欢迎回来' : '开始使用';
  $('card-sub').textContent   = isLogin ? '登录后开始管理你的设备' : '注册账号，添加设备，AI 能力即刻就绪';
  showErr('');
  if (!isLogin && CAPTCHA_ID) setupRegCaptcha();
}

function showErr(msg) { $('err-msg').textContent = msg; }

function setBtn(id, text, disabled) {
  const b = $('' + id);
  b.textContent = text; b.disabled = disabled;
}

async function doLogin(e) {
  e.preventDefault();
  showErr('');
  if (CAPTCHA_ID) {
    loginCaptchaToken = null;
    const trigger = () => { loginCaptchaIns.refresh(); loginCaptchaIns.verify(); };
    if (loginCaptchaIns) {
      trigger();
    } else {
      const wait = setInterval(() => {
        if (loginCaptchaIns) { clearInterval(wait); trigger(); }
      }, 100);
    }
    return;
  }
  await _submitLoginWithToken(loginCaptchaToken);
}

async function _submitLoginWithToken(tok) {
  setBtn('btn-login-submit', '登录中…', true);
  try {
    const res = await fetch('/v1/user/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:      $('login-email').value,
        password:   $('login-password').value,
        captcha_id: tok ? tok.captcha_id : '',
        validate:   tok ? tok.validate   : '',
        user:       '',
      }),
    });
    const data = await res.json();
    if (data.code === 200) {
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem('token', data.data.token);
      location.href = '/devices';
    } else {
      showErr(data.code === 401 ? '邮箱或密码错误' : data.code === 40012 ? '人机验证失败，请重试' : (data.msg || '登录失败'));
    }
  } finally {
    loginCaptchaToken = null;
    setBtn('btn-login-submit', '登录', false);
  }
}

// 点"获取验证码"：弹人机验证，通过后发送邮件验证码
async function doSendCode() {
  const email = $('reg-email').value.trim();
  if (!email) { showErr('请输入邮箱地址'); return; }
  showErr('');
  if (CAPTCHA_ID) {
    regCaptchaToken = null;
    _regSendAfterVerify = (tok) => _submitSendCode(email, tok);
    const trigger = () => { regCaptchaIns.refresh(); regCaptchaIns.verify(); };
    if (regCaptchaIns) {
      trigger();
    } else {
      const wait = setInterval(() => {
        if (regCaptchaIns) { clearInterval(wait); trigger(); }
      }, 100);
    }
  } else {
    await _submitSendCode(email, null);
  }
}

async function _submitSendCode(email, tok) {
  setBtn('btn-send-code', '发送中…', true);
  try {
    const res = await fetch('/v1/user/send-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:      email,
        captcha_id: tok ? tok.captcha_id : '',
        validate:   tok ? tok.validate   : '',
        user:       '',
      }),
    });
    const data = await res.json();
    if (data.code === 200) {
      showErr('');
      startSendCodeCooldown();
    } else {
      showErr(data.code === 40012 ? '人机验证失败，请重试' : (data.msg || '发送失败'));
      setBtn('btn-send-code', '获取验证码', false);
    }
  } finally {
    regCaptchaToken = null;
  }
}

function startSendCodeCooldown() {
  let secs = 60;
  const btn = $('btn-send-code');
  btn.disabled = true;
  btn.textContent = `${secs}s 后重新获取`;
  const t = setInterval(() => {
    secs--;
    if (secs <= 0) {
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = '重新获取';
    } else {
      btn.textContent = `${secs}s 后重新获取`;
    }
  }, 1000);
}

async function doRegister() {
  const email = $('reg-email').value.trim();
  const code  = $('reg-code').value.trim();
  const pwd   = $('reg-password').value;
  const pwd2  = $('reg-password2').value;
  if (!email) { showErr('请输入邮箱地址'); return; }
  if (!code)  { showErr('请输入验证码'); return; }
  if (!pwd)   { showErr('请输入密码'); return; }
  if (pwd !== pwd2) { showErr('两次密码不一致'); return; }
  setBtn('btn-register', '注册中…', true);
  showErr('');
  try {
    const res = await fetch('/v1/user/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pwd, code }),
    });
    const data = await res.json();
    if (data.code === 200) { localStorage.clear(); sessionStorage.clear(); localStorage.setItem('token', data.data.token); location.href = '/devices'; }
    else showErr(data.code === 40013 ? '验证码错误或已过期' : (data.msg || '注册失败'));
  } finally { setBtn('btn-register', '注册', false); }
}

if (localStorage.getItem('token')) location.href = '/devices';
initCaptchaId();
</script>

<!-- 易盾人机验证挂载点 — 放在 body 直属层，脱离 backdrop-blur card 的 containing block -->
<div id="login-captcha-wrap"></div>
<div id="reg-captcha-wrap"></div>
</body>
