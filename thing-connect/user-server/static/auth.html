<!doctype html>
<html lang="zh-CN" data-page="auth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="登录 TiRTC 体验平台，添加模拟器或真实设备，验证设备音视频能力。">
  <title>注册/登录 · TiRTC 体验平台</title>
  <!-- 网易易盾验证码 SDK（配置了 captcha_id 时生效） -->
  <script src="https://cstaticdun.126.net/load.min.js"></script>
  <style>
    :root {
      --ink: #172026;
      --muted: #687279;
      --line: #dfe4e2;
      --paper: #fbfcfa;
      --white: #ffffff;
      --accent: #0f766e;
      --accent-dark: #0b5d57;
      --accent-soft: #e9f6f2;
      --danger: #c43d3d;
      --shadow: 0 24px 70px rgba(21, 32, 31, 0.11);
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    [hidden],
    .hidden {
      display: none !important;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .shell {
      width: min(calc(100% - 48px), var(--max-width));
      margin: 0 auto;
    }

    .site-header {
      position: relative;
      z-index: 2;
      border-bottom: 1px solid rgba(223, 228, 226, 0.9);
      background: rgba(251, 252, 250, 0.9);
      backdrop-filter: blur(16px);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand-mark {
      position: relative;
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 9px;
      background: var(--ink);
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      content: "";
      border: 2px solid #79d2c4;
      border-radius: 50%;
    }

    .brand-mark::before {
      width: 16px;
      height: 16px;
      top: 6px;
      left: 6px;
    }

    .brand-mark::after {
      width: 4px;
      height: 4px;
      top: 12px;
      left: 12px;
      background: #79d2c4;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #4e595f;
      font-size: 14px;
      font-weight: 600;
      transition: color 160ms ease;
    }

    .back-home:hover {
      color: var(--accent);
    }

    .back-home svg {
      width: 16px;
      height: 16px;
    }

    .auth-main {
      position: relative;
      min-height: calc(100vh - 73px);
      overflow: hidden;
    }

    .auth-main::before {
      position: absolute;
      width: 520px;
      height: 520px;
      top: -355px;
      left: 42%;
      content: "";
      border-radius: 50%;
      background: rgba(111, 201, 188, 0.13);
      pointer-events: none;
    }

    .auth-main::after {
      position: absolute;
      width: 360px;
      height: 360px;
      right: -250px;
      bottom: -250px;
      content: "";
      border-radius: 50%;
      background: rgba(23, 32, 38, 0.045);
      pointer-events: none;
    }

    .auth-layout {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 73px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 56px;
      padding-bottom: 56px;
    }

    .auth-card {
      width: min(100%, 430px);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .mobile-brand {
      display: none;
    }

    .card-heading {
      margin-bottom: 27px;
    }

    .card-heading h2 {
      margin: 0 0 8px;
      font-size: 27px;
      line-height: 1.25;
      letter-spacing: -0.035em;
    }

    .card-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      margin-bottom: 25px;
      padding: 4px;
      border-radius: 11px;
      background: #f1f3f2;
    }

    .auth-tab {
      min-height: 40px;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .auth-tab:hover {
      color: var(--ink);
    }

    .auth-tab.active {
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 2px 8px rgba(21, 32, 31, 0.08);
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #455057;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #d7ddda;
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: var(--white);
      font-size: 15px;
      transition: border 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .field input::placeholder {
      color: #a1aaa7;
    }

    .field input:hover {
      border-color: #bbc7c3;
    }

    .field input:focus {
      border-color: var(--accent);
      background: #fcfffe;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }

    .code-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
    }

    .send-code {
      min-width: 112px;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #cbd4d1;
      border-radius: 10px;
      color: var(--accent);
      background: var(--white);
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
      transition: border 160ms ease, background 160ms ease;
    }

    .send-code:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .primary-button {
      width: 100%;
      min-height: 49px;
      margin-top: 4px;
      padding: 12px 18px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      color: var(--white);
      background: var(--ink);
      font-size: 15px;
      font-weight: 750;
      transition: transform 160ms ease, background 160ms ease;
    }

    .primary-button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #2a353a;
    }

    .form-note {
      min-height: 20px;
      margin: 14px 0 0;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .card-footnote {
      margin: 7px 0 0;
      color: #8a9491;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    /* 易盾 popup 弹层修复：挂载点放在 fixed 层，但 SDK 容器宽高为 0 导致遮罩失效。
       强制 popup 容器和遮罩层撑满视口，确保弹窗正常显示并拦截背景点击。 */
    .yidun_popup {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
    }
    .yidun_popup__mask {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    .yidun_cover-frame {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(calc(100% - 32px), var(--max-width));
      }

      .nav {
        min-height: 64px;
      }

      .brand {
        font-size: 15px;
      }

      .auth-main {
        min-height: calc(100vh - 65px);
      }

      .auth-layout {
        min-height: calc(100vh - 65px);
        padding-top: 30px;
        padding-bottom: 40px;
      }

      .auth-card {
        max-width: 450px;
        padding: 27px 22px 24px;
        border-radius: 17px;
      }

      .mobile-brand {
        display: block;
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .card-heading {
        margin-bottom: 23px;
      }

      .card-heading h2 {
        font-size: 24px;
      }
    }

    @media (max-width: 420px) {
      .shell {
        width: min(calc(100% - 24px), var(--max-width));
      }

      .brand span:last-child {
        max-width: 184px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .back-home span {
        display: none;
      }

      .auth-card {
        padding-right: 18px;
        padding-left: 18px;
      }

      .field input {
        font-size: 16px;
      }

      .send-code {
        min-width: 104px;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav shell" aria-label="登录页导航">
      <a class="brand" href="/" aria-label="返回 TiRTC 开源示例首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>TiRTC · OPEN EXAMPLES</span>
      </a>
      <a class="back-home" href="/">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 10H4M9 5l-5 5 5 5"/>
        </svg>
        <span>返回示例首页</span>
      </a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-layout shell">
      <section class="auth-card" aria-labelledby="card-title">
        <p class="mobile-brand">TiRTC Experience Platform</p>
        <div class="card-heading">
          <h2 id="card-title">登录体验平台</h2>
          <p id="card-sub">继续管理和调试你的 TiRTC 设备</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="账号操作">
          <button class="auth-tab active" id="tab-login" type="button" role="tab" aria-selected="true" onclick="switchTab('login')">登录</button>
          <button class="auth-tab" id="tab-register" type="button" role="tab" aria-selected="false" onclick="switchTab('register')">免费注册</button>
        </div>

        <form id="form-login" onsubmit="doLogin(event)">
          <div class="field">
            <label for="login-email">邮箱</label>
            <input type="email" id="login-email" placeholder="请输入邮箱地址" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
          </div>
          <button class="primary-button" type="submit" id="btn-login-submit">登录</button>
        </form>

        <form id="form-register" class="hidden" onsubmit="doRegister(event)">
          <div class="field">
            <label for="reg-email">邮箱</label>
            <input type="email" id="reg-email" placeholder="请输入邮箱地址" required autocomplete="email">
          </div>
          <div class="field">
            <label for="reg-code">邮箱验证码</label>
            <div class="code-row">
              <input type="text" id="reg-code" placeholder="6 位验证码" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required autocomplete="one-time-code">
              <button class="send-code" type="button" onclick="doSendCode()" id="btn-send-code">获取验证码</button>
            </div>
          </div>
          <div class="field">
            <label for="reg-password">设置密码</label>
            <input type="password" id="reg-password" placeholder="至少 6 位" minlength="6" required autocomplete="new-password">
          </div>
          <div class="field">
            <label for="reg-password2">确认密码</label>
            <input type="password" id="reg-password2" placeholder="再次输入密码" minlength="6" required autocomplete="new-password">
          </div>
          <button class="primary-button" type="submit" id="btn-register">创建账号并进入平台</button>
        </form>

        <p class="form-note" id="err-msg" role="alert" aria-live="polite"></p>
        <p class="card-footnote">账号用于登录 TiRTC 体验平台和管理测试设备</p>
      </section>
    </div>
  </main>

<script>
const $ = id => document.getElementById(id);
// ── Captcha (网易易盾) ────────────────────────────────────────────────────
// CAPTCHA_ID 从后端 /v1/config/captcha 获取，未配置时为空字符串走 dev 模式
let CAPTCHA_ID = '';
let loginCaptchaToken = null;   // { captcha_id, validate, user }
let regCaptchaToken   = null;
let captchaInitPromise = null;

async function initCaptchaId() {
  try {
    const res = await fetch('/v1/config/captcha');
    if (!res.ok) throw new Error('captcha config request failed');
    const d = await res.json();
    CAPTCHA_ID = d.data && d.data.captcha_id ? d.data.captcha_id : '';
    if (CAPTCHA_ID) setupCaptcha();
    return true;
  } catch (_) {
    return false;
  }
}

let loginCaptchaIns = null;
let regCaptchaIns   = null;
let loginCaptchaInited = false;
let regCaptchaInited   = false;
// 注册流：验证通过后自动触发的回调
let _regSendAfterVerify = null;

function initCaptchaInstance(elementId, onVerified, onInstance) {
  window.initNECaptcha(
    {
      captchaId: CAPTCHA_ID,
      element: '#' + elementId,
      mode: 'popup',
      width: Math.min(320, window.innerWidth - 24) + 'px',
      apiVersion: 2,
      onVerify(err, data) {
        if (err) return;
        onVerified({ captcha_id: CAPTCHA_ID, validate: data.validate, user: '' });
      },
    },
    function onload(instance) { onInstance(instance); },
    function onerror(err) { console.warn('captcha init error', err); }
  );
}

function setupLoginCaptcha() {
  if (loginCaptchaInited) return;
  if (!window.initNECaptcha) return;
  loginCaptchaInited = true;
  initCaptchaInstance('login-captcha-wrap',
    tok => {
      loginCaptchaToken = tok;
      _submitLoginWithToken(tok);
    },
    ins => { loginCaptchaIns = ins; }
  );
}

function setupRegCaptcha() {
  if (regCaptchaInited) return;
  if (!window.initNECaptcha) return;
  regCaptchaInited = true;
  initCaptchaInstance('reg-captcha-wrap',
    tok => {
      regCaptchaToken = tok;
      if (_regSendAfterVerify) { const fn = _regSendAfterVerify; _regSendAfterVerify = null; fn(tok); }
    },
    ins => { regCaptchaIns = ins; }
  );
}

function setupCaptcha() {
  setupLoginCaptcha();
  if (!$('form-register').classList.contains('hidden')) setupRegCaptcha();
}

async function waitForCaptcha(getInstance, setupInstance) {
  for (let i = 0; i < 80; i++) {
    setupInstance();
    const instance = getInstance();
    if (instance) return instance;
    await new Promise(resolve => setTimeout(resolve, 100));
  }
  throw new Error('captcha load timeout');
}

// ── Auth logic ────────────────────────────────────────────────────────────
function switchTab(tab, updateUrl = true) {
  const isLogin = tab === 'login';
  $('form-login').classList.toggle('hidden', !isLogin);
  $('form-register').classList.toggle('hidden', isLogin);
  $('tab-login').classList.toggle('active', isLogin);
  $('tab-register').classList.toggle('active', !isLogin);
  $('tab-login').setAttribute('aria-selected', String(isLogin));
  $('tab-register').setAttribute('aria-selected', String(!isLogin));
  $('card-title').textContent = isLogin ? '登录体验平台' : '创建体验账号';
  $('card-sub').textContent   = isLogin ? '继续管理和调试你的 TiRTC 设备' : '注册后即可添加模拟器或真实设备';
  document.title = isLogin ? '登录 · TiRTC 体验平台' : '注册 · TiRTC 体验平台';
  if (updateUrl) history.replaceState(null, '', isLogin ? '/login' : '/register');
  showErr('');
  if (!isLogin && CAPTCHA_ID) setupRegCaptcha();
}

function showErr(msg) { $('err-msg').textContent = msg; }

function setBtn(id, text, disabled) {
  const b = $('' + id);
  b.textContent = text; b.disabled = disabled;
}

async function doLogin(e) {
  e.preventDefault();
  showErr('');
  if (captchaInitPromise && !(await captchaInitPromise)) {
    showErr('页面配置加载失败，请刷新后重试');
    return;
  }
  if (CAPTCHA_ID) {
    loginCaptchaToken = null;
    try {
      const instance = await waitForCaptcha(() => loginCaptchaIns, setupLoginCaptcha);
      instance.refresh();
      instance.verify();
    } catch (_) {
      showErr('人机验证加载失败，请刷新页面重试');
    }
    return;
  }
  await _submitLoginWithToken(loginCaptchaToken);
}

async function _submitLoginWithToken(tok) {
  setBtn('btn-login-submit', '登录中…', true);
  try {
    const res = await fetch('/v1/user/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:      $('login-email').value,
        password:   $('login-password').value,
        captcha_id: tok ? tok.captcha_id : '',
        validate:   tok ? tok.validate   : '',
        user:       '',
      }),
    });
    const data = await res.json();
    if (data.code === 200) {
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem('token', data.data.token);
      location.href = '/devices';
    } else {
      showErr(data.code === 401 ? '邮箱或密码错误' : data.code === 40012 ? '人机验证失败，请重试' : (data.msg || '登录失败'));
    }
  } catch (_) {
    showErr('网络连接失败，请稍后重试');
  } finally {
    loginCaptchaToken = null;
    setBtn('btn-login-submit', '登录', false);
  }
}

// 点"获取验证码"：弹人机验证，通过后发送邮件验证码
async function doSendCode() {
  const emailInput = $('reg-email');
  const email = emailInput.value.trim();
  if (!email) { showErr('请输入邮箱地址'); return; }
  if (!emailInput.checkValidity()) { showErr('请输入正确的邮箱地址'); return; }
  showErr('');
  if (captchaInitPromise && !(await captchaInitPromise)) {
    showErr('页面配置加载失败，请刷新后重试');
    return;
  }
  if (CAPTCHA_ID) {
    regCaptchaToken = null;
    _regSendAfterVerify = (tok) => _submitSendCode(email, tok);
    try {
      const instance = await waitForCaptcha(() => regCaptchaIns, setupRegCaptcha);
      instance.refresh();
      instance.verify();
    } catch (_) {
      _regSendAfterVerify = null;
      showErr('人机验证加载失败，请刷新页面重试');
    }
  } else {
    await _submitSendCode(email, null);
  }
}

async function _submitSendCode(email, tok) {
  setBtn('btn-send-code', '发送中…', true);
  try {
    const res = await fetch('/v1/user/send-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:      email,
        captcha_id: tok ? tok.captcha_id : '',
        validate:   tok ? tok.validate   : '',
        user:       '',
      }),
    });
    const data = await res.json();
    if (data.code === 200) {
      showErr('');
      startSendCodeCooldown();
    } else {
      showErr(data.code === 40012 ? '人机验证失败，请重试' : (data.msg || '发送失败'));
      setBtn('btn-send-code', '获取验证码', false);
    }
  } catch (_) {
    showErr('网络连接失败，请稍后重试');
    setBtn('btn-send-code', '获取验证码', false);
  } finally {
    regCaptchaToken = null;
  }
}

function startSendCodeCooldown() {
  let secs = 60;
  const btn = $('btn-send-code');
  btn.disabled = true;
  btn.textContent = `${secs}s 后重新获取`;
  const t = setInterval(() => {
    secs--;
    if (secs <= 0) {
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = '重新获取';
    } else {
      btn.textContent = `${secs}s 后重新获取`;
    }
  }, 1000);
}

async function doRegister(e) {
  if (e) e.preventDefault();
  const email = $('reg-email').value.trim();
  const code  = $('reg-code').value.trim();
  const pwd   = $('reg-password').value;
  const pwd2  = $('reg-password2').value;
  if (!email) { showErr('请输入邮箱地址'); return; }
  if (!code)  { showErr('请输入验证码'); return; }
  if (!pwd)   { showErr('请输入密码'); return; }
  if (pwd !== pwd2) { showErr('两次密码不一致'); return; }
  setBtn('btn-register', '注册中…', true);
  showErr('');
  try {
    const res = await fetch('/v1/user/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pwd, code }),
    });
    const data = await res.json();
    if (data.code === 200) { localStorage.clear(); sessionStorage.clear(); localStorage.setItem('token', data.data.token); location.href = '/devices'; }
    else showErr(data.code === 40013 ? '验证码错误或已过期' : (data.msg || '注册失败'));
  } catch (_) {
    showErr('网络连接失败，请稍后重试');
  } finally { setBtn('btn-register', '创建账号并进入平台', false); }
}

if (localStorage.getItem('token')) {
  location.href = '/devices';
} else {
  const requestedTab = location.pathname === '/register'
    || new URLSearchParams(location.search).get('tab') === 'register'
    ? 'register'
    : 'login';
  switchTab(requestedTab, false);
  captchaInitPromise = initCaptchaId();
}
</script>

<!-- 易盾人机验证挂载点 — 放在 body 直属层，脱离 backdrop-blur card 的 containing block -->
<div id="login-captcha-wrap"></div>
<div id="reg-captcha-wrap"></div>
</body>
</html>
