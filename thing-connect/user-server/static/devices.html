<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThingConnect — 我的设备</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">

<!-- TOPBAR -->
<header class="sticky top-0 z-50 flex items-center justify-between h-[60px] px-8 bg-white border-b border-gray-200">
  <div class="flex items-center gap-2.5">
    <div class="w-[30px] h-[30px] bg-gradient-to-br from-emerald-400 to-blue-500 rounded-[7px] flex items-center justify-center">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <path d="M5.64 5.64l1.77 1.77M16.6 16.6l1.76 1.76M5.64 18.36l1.77-1.77M16.6 7.4l1.76-1.76"/>
      </svg>
    </div>
    <span class="text-base font-bold tracking-tight text-gray-900">ThingConnect</span>
  </div>
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-gray-200 bg-gray-50">
      <div id="user-avatar" class="w-[26px] h-[26px] rounded-full bg-gradient-to-br from-violet-400 to-blue-500 flex items-center justify-center text-[11px] font-bold text-white">U</div>
    </div>
    <button onclick="logout()" class="text-xs text-gray-400 hover:text-gray-600 transition-colors px-2 py-1">退出</button>
  </div>
</header>

<!-- MAIN -->
<main class="relative max-w-[1200px] mx-auto px-8 pt-9 pb-24 max-sm:px-3.5 max-sm:pt-5 max-sm:pb-32">
  <div class="flex items-end justify-between mb-7">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">
      我的设备 <span id="device-count" class="text-sm font-normal text-gray-400 ml-2"></span>
    </h1>
    <button onclick="loadDevices()" class="flex items-center gap-1.5 text-xs text-gray-500 bg-white border border-gray-200 rounded-lg px-3.5 py-1.5 hover:border-gray-300 hover:text-gray-700 transition-all">
      <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
      <span>刷新</span>
    </button>
  </div>

  <div id="device-grid" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr))">
    <!-- cards injected by JS -->
    <div class="col-span-full flex flex-col items-center py-20 text-center">
      <div class="w-16 h-16 mb-5 rounded-2xl bg-emerald-50 border border-dashed border-emerald-200 flex items-center justify-center text-emerald-500">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <p class="text-base font-semibold text-gray-800 mb-2">还没有设备</p>
      <p class="text-sm text-gray-400">点击"添加设备"，输入验证码完成绑定</p>
    </div>
  </div>
</main>

<!-- FAB -->
<button onclick="goAdd()" class="fixed right-9 bottom-9 flex items-center gap-2 px-6 py-3.5 bg-emerald-500 text-white text-sm font-bold rounded-2xl shadow-lg shadow-emerald-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-emerald-200 active:scale-[0.98] transition-all max-sm:right-4 max-sm:bottom-5">
  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
  添加设备
</button>

<!-- RESET MODAL -->
<div id="reset-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[200] items-center justify-center">
  <div class="bg-white border border-gray-200 rounded-2xl p-7 w-[360px] max-w-[calc(100vw-48px)] shadow-xl">
    <h2 class="text-[17px] font-bold text-gray-900 mb-2">确认重置设备？</h2>
    <p class="text-sm text-gray-500 leading-relaxed mb-6">重置后设备将解绑，需重新走绑定流程才能恢复使用。此操作不可撤回。</p>
    <div class="flex gap-2.5">
      <button onclick="closeModal()" class="flex-1 py-2.5 text-sm text-gray-500 bg-gray-50 border border-gray-200 rounded-lg hover:border-gray-300 transition-colors">取消</button>
      <button onclick="doReset()" class="flex-1 py-2.5 text-sm font-semibold text-red-600 bg-red-50 border border-red-200 rounded-lg hover:bg-red-100 transition-colors">确认重置</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-[100px] left-1/2 bg-gray-900 text-white text-sm px-5 py-2.5 rounded-full pointer-events-none whitespace-nowrap z-[300] border border-transparent"></div>

<script>
const $ = id => document.getElementById(id);
const token = localStorage.getItem('token');
if (!token) location.href = '/';

let resetDeviceID = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  return res.json();
}

function toast(msg, error = false) {
  const el = $('toast');
  el.textContent = msg;
  el.style.borderColor = error ? 'rgba(239,68,68,0.4)' : 'rgba(16,185,129,0.4)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

async function goAdd() {
  const quotaData = await api('/v1/user/quota');
  if (quotaData.code === 200 && quotaData.data.quota <= 0) {
    toast('设备额度已用尽，请联系管理员申请扩容', true);
    return;
  }
  location.href = '/bind';
}

async function loadDevices() {
  const devData = await api('/v1/user/device/list');

  const grid = $('device-grid');

  if (devData.code !== 200 || !devData.data?.length) {
    $('device-count').textContent = '';
    grid.innerHTML = `
      <div class="col-span-full flex flex-col items-center py-20 text-center">
        <div class="w-16 h-16 mb-5 rounded-2xl bg-emerald-50 border border-dashed border-emerald-200 flex items-center justify-center text-emerald-500">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </div>
        <p class="text-base font-semibold text-gray-800 mb-2">还没有设备</p>
        <p class="text-sm text-gray-400">点击"添加设备"，输入验证码完成绑定</p>
      </div>`;
    return;
  }

  $('device-count').textContent = `(${devData.data.length})`;

  grid.innerHTML = devData.data.map(d => {
    const isBound  = d.status === 1;
    const isOnline = d.online;

    return `
    <div class="bg-white border ${isOnline ? 'border-emerald-200' : 'border-gray-200'} rounded-2xl overflow-hidden shadow-sm hover:-translate-y-0.5 hover:shadow-md transition-all duration-150">
      <div class="flex items-start justify-between gap-2.5 px-[18px] pt-4 pb-3 border-b border-gray-100 min-w-0">
        <div class="min-w-0 flex-1">
          <div class="font-mono text-[13px] font-medium text-gray-900 mb-1.5 truncate">${d.device_id || '—'}</div>
          <div class="flex items-center gap-2">
            ${isBound ? `
              <span class="w-[7px] h-[7px] rounded-full flex-shrink-0 ${isOnline ? 'bg-emerald-500 animate-pulse-dot' : 'bg-gray-300'}"></span>
              <span class="text-[11px] font-medium ${isOnline ? 'text-emerald-600' : 'text-gray-400'}">${isOnline ? '在线' : '离线'}</span>
            ` : ''}
            <span class="text-[10px] font-medium px-2 py-0.5 rounded-full ${isBound ? 'bg-violet-50 text-violet-600 border border-violet-200' : 'bg-gray-100 text-gray-400 border border-gray-200'}">${isBound ? '已绑定' : '未绑定'}</span>
          </div>
        </div>
        ${isBound ? `<button onclick="askReset('${d.device_id}')" class="flex-shrink-0 text-[11px] font-medium px-2.5 py-1 rounded-md border border-gray-200 text-gray-400 hover:border-red-200 hover:text-red-500 hover:bg-red-50 transition-all whitespace-nowrap">重置</button>` : ''}
      </div>

      <div class="px-5 py-3.5">
        ${d.mac ? `
        <div class="flex items-center gap-2 mb-2">
          <span class="font-mono text-[11px] text-gray-400 w-[52px] flex-shrink-0">MAC</span>
          <span class="font-mono text-xs text-gray-600 truncate min-w-0">${d.mac}</span>
        </div>` : ''}
        ${d.bind_time ? `
        <div class="flex items-center gap-2">
          <span class="font-mono text-[11px] text-gray-400 w-[52px] flex-shrink-0">绑定</span>
          <span class="font-mono text-xs text-gray-600 truncate min-w-0">${d.bind_time}</span>
        </div>` : ''}
        ${!d.mac && !d.bind_time ? `<p class="text-xs text-gray-400">设备尚未绑定物理硬件</p>` : ''}
      </div>

      <div class="grid grid-cols-3 gap-2 px-4 py-2.5 border-t border-gray-100">
        <button class="flex items-center justify-center gap-1.5 py-1.5 text-xs font-medium rounded-lg border transition-all border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-gray-800 hover:border-gray-300"
          onclick="goLive('${d.device_id}')" title="实时音视频">
          <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="2" y="5" width="13" height="10" rx="2"/><path d="M15 8l3-2v8l-3-2"/>
          </svg>
          实时
        </button>
        <button class="flex items-center justify-center gap-1.5 py-1.5 text-xs font-medium rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-gray-800 hover:border-gray-300 transition-all"
          onclick="goConfig('${d.device_id}')" title="配置智能体">
          <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          智能体
        </button>
        <button class="flex items-center justify-center gap-1.5 py-1.5 text-xs font-medium rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-gray-800 hover:border-gray-300 transition-all"
          onclick="goContacts('${d.device_id}')" title="联系人管理">
          <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          联系人
        </button>
      </div>
    </div>`;
  }).join('');
}

function goLive(id)     { location.href = '/player?device_id=' + encodeURIComponent(id); }
function goConfig(id)   { location.href = '/v1/ai/agent?device_id=' + encodeURIComponent(id); }
function goContacts(id) { location.href = '/contacts?device_id=' + encodeURIComponent(id); }

function askReset(deviceID) {
  resetDeviceID = deviceID;
  const modal = $('reset-modal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeModal() {
  resetDeviceID = null;
  const modal = $('reset-modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

async function doReset() {
  const id = resetDeviceID;
  closeModal();
  const data = await api('/v1/user/device/reset', {
    method: 'DELETE',
    body: JSON.stringify({ device_id: id }),
  });
  if (data.code === 200) { toast('设备已重置'); loadDevices(); }
  else toast(data.msg || '重置失败', true);
}

function logout() {
  localStorage.clear();
  sessionStorage.clear();
  location.href = '/';
}

loadDevices();
</script>
</body>
</html>
