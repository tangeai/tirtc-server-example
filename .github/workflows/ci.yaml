name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: thing_connect_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: thing-connect/go.mod
          cache-dependency-path: thing-connect/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            thing-connect/package-lock.json
            thing-connect/admin/admin-web/package-lock.json
      - name: Go lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: thing-connect
      - name: Go vet
        working-directory: thing-connect
        run: go vet ./...
      - name: Go tests
        working-directory: thing-connect
        env:
          THING_CONNECT_TEST_CONFIG: tests/testdata/config.yaml
        run: go test ./... -p 1 -count=1
      - name: Deployment script tests
        working-directory: thing-connect
        run: |
          bash scripts/install_test.sh
          bash scripts/service-local_test.sh
          bash scripts/deploy-prod_test.sh
      - name: Build web applications
        working-directory: thing-connect
        run: |
          npm ci
          npm run build:css
          npm --prefix admin/admin-web ci
          npm --prefix admin/admin-web run check

  device-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install device simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libssl-dev libmosquitto-dev libcjson-dev pkg-config
      - name: Linux C reference checks
        working-directory: thing-connect/device-sim/device-sim-c
        run: |
          make WERROR=1 test
          make WERROR=1 framework
          make WERROR=1 adapter-template-check
          ASAN_OPTIONS=detect_leaks=0 make SANITIZE=address,undefined WERROR=1 test
      - name: Shared device core tests
        run: |
          cmake -S thing-connect/device-sim/common/device_core -B /tmp/device-core-build -DBUILD_TESTING=ON -DCMAKE_C_FLAGS=-Werror
          cmake --build /tmp/device-core-build
          ctest --test-dir /tmp/device-core-build --output-on-failure

  python-simulator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: thing-connect/device-sim/device-sim-py/requirements.txt
      - name: Install Python simulator dependencies
        run: python -m pip install --requirement thing-connect/device-sim/device-sim-py/requirements.txt
      - name: Python simulator tests
        working-directory: thing-connect/device-sim/device-sim-py
        env:
          TIRTC_SDK_VERSION: 2.3.0
        run: python -m unittest discover -p 'test_*.py'

  esp32-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: ESP32-S3 firmware build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: thing-connect/device-sim/device-sim-esp32
